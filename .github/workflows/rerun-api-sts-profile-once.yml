name: Rerun API Market Scan STS profile once
on:
  push:
    paths:
      - '.github/workflows/rerun-api-sts-profile-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Build STS-oriented API report for today
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          python tools/api_national_today_prefetch.py
          python tools/api_market_scan.py
          python tools/api_market_v3_enrich.py
          python tools/api_market_report_diversify.py
          python -m pip install --disable-pip-version-check 'reportlab>=4,<5'
          python tools/render_api_market_pdf.py
      - name: Commit outputs and self-remove
        shell: bash
        run: |
          rm .github/workflows/rerun-api-sts-profile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/market_scan data/api_football/market_snapshots data/api_football/national_dynamic reports/api_market_scan .github/workflows/rerun-api-sts-profile-once.yml
          git commit -m "report: regenerate API Market Scan for STS profile"
          git pull --rebase origin main
          git push origin main
