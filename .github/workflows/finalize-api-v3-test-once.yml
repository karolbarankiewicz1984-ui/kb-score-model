name: Finalize API v3 and trigger test once
on:
  push:
    paths:
      - '.github/workflows/finalize-api-v3-test-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch legend and settlement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('tools/render_api_market_pdf.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('author="API Market Scan v2"', 'author="API Market Scan v3"')
          start='''            "<b>API PURE</b> - co wynika wyłącznie z naszej historii i statystyk API, bez kursów. "
            "<b>Po analizie rynku</b> - ta sama pozycja po sprawdzeniu aktualnych notowań bukmacherów. "
            "<b>↑ / ↓ / →</b> - rynek odpowiednio podnosi, obniża albo praktycznie nie zmienia oceny. "
            "<b>Sygnał rynku</b> - krótka ocena, czy rynek potwierdza statystykę, jest neutralny czy ostrzega. "
            "<b>Komentarz</b> - prostym językiem wyjaśnia, dlaczego ocena się zmieniła lub pozostała bez zmian. "
            "Ten raport jest osobny od KB Score 2.1 CORE i nie zmienia jego ustawień ani N.",'''
          repl='''            "<b>API PURE</b> - surowy wynik z historii i statystyk, bez późniejszych korekt. "
            "<b>Ocena końcowa</b> - konserwatywna ocena po sprawdzeniu wiarygodności próby, rodzaju rozgrywek, rynku i dostępnego bieżącego kontekstu. "
            "<b>↑ / ↓ / →</b> - ocena końcowa jest odpowiednio wyższa, niższa albo podobna do API PURE. "
            "<b>STRONG</b> oznacza najmocniejsze pozycje; <b>ACCEPT</b> - pozycje spełniające warunki publikacji. "
            "<b>Komentarz</b> prostym językiem mówi, co najbardziej wpłynęło na ocenę. "
            "Pełna techniczna warstwa pozostaje w JSON-ie na GitHubie. Raport jest osobny od KB Score 2.1 CORE i nie zmienia jego ustawień ani N.",'''
          if start not in s:
              raise SystemExit('old PDF legend not found')
          p.write_text(s.replace(start,repl),encoding='utf-8')

          p=Path('tools/api_market_settle.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("add(f\"market:{o['market']}\",o); add(f\"status:{o['final_status']}\",o);", "add(f\"market:{o['market']}\",o); add(f\"status:{o.get('final_status') or 'LEGACY'}\",o);")
          old='''        o={"date":TARGET,"fixture_id":fid,"selection":item.get("selection"),"competition":item.get("competition"),"category":item.get("category"),"market":item["market"],"line":item["line"],"actual":actual,"hit":hit,"api_pure_pct":item.get("api_pure_pct"),"reliability_adjusted_pct":item.get("reliability_adjusted_pct"),"market_adjusted_pct":item.get("market_adjusted_pct"),"market_delta_pp":item.get("market_delta_pp"),"final_assessment_pct":item.get("final_assessment_pct"),"final_status":item.get("final_status"),"closing":close}'''
          new='''        final_pct=item.get("final_assessment_pct")
        if final_pct is None: final_pct=item.get("market_adjusted_pct",item.get("api_pure_pct"))
        final_status=item.get("final_status") or "LEGACY"
        o={"date":TARGET,"fixture_id":fid,"selection":item.get("selection"),"competition":item.get("competition"),"category":item.get("category"),"market":item["market"],"line":item["line"],"actual":actual,"hit":hit,"api_pure_pct":item.get("api_pure_pct"),"reliability_adjusted_pct":item.get("reliability_adjusted_pct",item.get("api_pure_pct")),"market_adjusted_pct":item.get("market_adjusted_pct",item.get("api_pure_pct")),"market_delta_pp":item.get("market_delta_pp",0),"final_assessment_pct":final_pct,"final_status":final_status,"closing":close}'''
          if old not in s:
              raise SystemExit('legacy settlement block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/finalize-api-v3-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/render_api_market_pdf.py tools/api_market_settle.py .github/workflows/finalize-api-v3-test-once.yml
          git commit -m "fix: finalize API Market v3 user layer and settlement"
          git pull --rebase origin main
          git push origin main
