name: MULTIMODEL v2 isolated regression
on:
  push:
    branches: [codex/multimodel-v2]
    paths:
      - 'multimodel_v2/**'
      - 'tests/test_multimodel_v2*.py'
      - 'docs/MULTIMODEL_V2*.md'
      - '.github/workflows/multimodel-v2-checks.yml'
  pull_request:
    paths:
      - 'multimodel_v2/**'
      - 'tests/test_multimodel_v2*.py'
      - 'docs/MULTIMODEL_V2*.md'
      - '.github/workflows/multimodel-v2-checks.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PDF and parser dependencies
        run: |
          python -m pip install -r multimodel_v2/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Full offline regression including PDF validation
        run: python -B -m unittest discover -s tests
