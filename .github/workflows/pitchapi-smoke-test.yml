name: PitchAPI - test polaczenia i xG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: PitchAPI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
    steps:
      - name: Zainstaluj oficjalne SDK PitchAPI
        run: python -m pip install --disable-pip-version-check "pitchapi==0.1.6"
      - name: Sprawdz autoryzacje, Cloudflare, ligi i xG
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import httpx
          from pitchapi import PitchAPI

          key = os.getenv("PITCHAPI_API_KEY", "").strip()
          if not key:
              print("BRAK SECRET PITCHAPI_API_KEY. Dodaj go w GitHub Actions secrets.")
              sys.exit(1)

          lines = ["# PitchAPI - wynik testu", "", "Klucz nie jest wyswietlany.", ""]
          def report(msg):
              print(msg)
              lines.append("- " + msg)
          def finish(code):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
              sys.exit(code)

          browser_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
          http = httpx.Client(
              base_url="https://api.pitchapi.dev",
              headers={"X-API-KEY": key, "Accept": "application/json", "User-Agent": browser_agent},
              timeout=12,
          )
          def raw(path):
              try:
                  response = http.get(path)
                  if response.status_code != 200:
                      cf = "tak" if "cloudflare" in response.headers.get("server", "").lower() else "nieznane"
                      block_1010 = "tak" if ("error 1010" in response.text.lower() or "browser_signature_banned" in response.text.lower()) else "nie"
                      report(f"{path}: HTTP {response.status_code}; Cloudflare={cf}; blokada podpisu klienta 1010={block_1010}; typ={response.headers.get('content-type', 'nieznany')}")
                      return None
                  result = response.json()
                  if "error" in result:
                      report(f"{path}: API error code={result['error'].get('code', 'brak')}")
                      return None
                  return result.get("data")
              except Exception as exc:
                  report(f"{path}: problem z siecia/formatem ({type(exc).__name__})")
                  return None

          mode = "SDK"
          sdk_client = None
          try:
              sdk_client = PitchAPI(api_key=key)
              leagues_data = sdk_client.leagues.list()
              leagues = list(leagues_data.leagues)
              report(f"Autoryzacja: OK przez oficjalne SDK, liczba lig={len(leagues)}")
          except Exception as exc:
              report(f"SDK nie uzyskalo listy lig: {type(exc).__name__}; HTTP={getattr(exc, 'status_code', 'nieznany')}; code={getattr(exc, 'code', 'brak')}")
              mode = "HTTPX-UA"
              catalog = raw("/v1/leagues")
              if catalog is None:
                  report("WYNIK: brak dostepu do API; nie mozna jeszcze uznac klucza za nieprawidlowy.")
                  http.close()
                  if sdk_client:
                      sdk_client.close()
                  finish(1)
              leagues = catalog.get("leagues") or []
              report(f"Autoryzacja: OK przez HTTPX z User-Agent, liczba lig={len(leagues)}")

          for wanted in ("Europa League", "Conference League", "Champions League", "Premier League", "Ekstraklasa"):
              names = [getattr(l, 'name', '') if mode == "SDK" else l.get("name", "") for l in leagues]
              matches = [name for name in names if wanted.lower() in (name or "").lower()]
              report(f"{wanted}: {', '.join(matches) if matches else 'nie znaleziono'}")

          xg_found = False
          inspected = 0
          for date in ("2026-10-14", "2026-10-12", "2025-11-09"):
              try:
                  if mode == "SDK":
                      day_matches = list(sdk_client.date.get(date).matches)
                  else:
                      result = raw("/v1/date/" + date)
                      if result is None:
                          continue
                      day_matches = result.get("matches") or []
              except Exception as exc:
                  report(f"Data {date}: blad {type(exc).__name__}")
                  continue
              report(f"Data {date}: liczba rozegranych meczow={len(day_matches)}")
              for match in day_matches[:7]:
                  mid = getattr(match, "id", None) if mode == "SDK" else match.get("id")
                  if not mid:
                      continue
                  inspected += 1
                  try:
                      if mode == "SDK":
                          shot_response = sdk_client.matches.shots(mid)
                          periods = shot_response.periods
                          values = [s.expected_goals for period in periods for s in period.shots if isinstance(s.expected_goals, (int, float))]
                      else:
                          result = raw("/v1/matches/" + mid + "/shots")
                          if result is None:
                              continue
                          values = [s["expected_goals"] for period in result.get("periods", []) for s in period.get("shots", []) if isinstance(s.get("expected_goals"), (int, float))]
                      if values:
                          report(f"xG DOSTEPNE: mecz {mid}; liczba strzalow z xG={len(values)}; suma xG={sum(values):.3f}")
                          xg_found = True
                          break
                  except Exception as exc:
                      report(f"Strzaly meczu {mid}: blad {type(exc).__name__}")
              if xg_found:
                  break

          report(f"Sprawdzono meczow pod katem xG: {inspected}")
          report("WYNIK: autoryzacja i xG OK" if xg_found else "WYNIK: autoryzacja OK, xG niepotwierdzone w sprawdzonych meczach")
          http.close()
          if sdk_client:
              sdk_client.close()
          finish(0 if xg_found else 2)
          PY
