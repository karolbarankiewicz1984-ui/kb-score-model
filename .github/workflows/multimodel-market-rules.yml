name: MultiModel V2 — market rules safety and archived Superbet audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'github_models/market_rule_gate.py'
      - 'github_models/disciplinary_rules.py'
      - 'tests/test_multimodel_disciplinary_review.py'
      - 'github_models/priced_shadow_settlement.py'
      - 'github_models/independent_final_score_bridge.py'
      - 'github_models/multimodel_calibration_gate.py'
      - 'data/github_models/independent_final_evidence_2026-11-20.json'
      - 'research/multimodel/non_pl_opta_source_inventory_20261123.json'
      - 'tests/test_independent_final_score_bridge.py'
      - 'tests/test_priced_shadow_settlement.py'
      - 'tests/test_multimodel_market_rule_gate.py'
      - 'github_models/unified_output.py'
      - '.github/workflows/multimodel-market-rules.yml'
  push:
    branches: [main]
    paths:
      - 'github_models/market_rule_gate.py'
      - 'github_models/disciplinary_rules.py'
      - 'tests/test_multimodel_disciplinary_review.py'
      - 'tests/test_multimodel_market_rule_gate.py'
      - 'github_models/unified_output.py'
      - '.github/workflows/multimodel-market-rules.yml'
  workflow_run:
    workflows:
      - 'MULTIMODEL V2 - Superbet OddsPapi market layer (daily)'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: multimodel-market-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  market-rules:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF library for reporting integration regression
        run: python -m pip install 'reportlab>=4,<5'
      - name: Regression tests — no scope or settlement substitutions
        run: python -m unittest -v tests.test_multimodel_market_rule_gate tests.test_priced_shadow_settlement tests.test_independent_final_score_bridge tests.test_multimodel_disciplinary_review

      - name: Checkout archived resolver and frozen forecasts for evidence integration
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: codex/multimodel-v2
          path: shadow_impl
          persist-credentials: false
      - name: Read frozen pre-match queue from original research branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: frozen_source
          persist-credentials: false
      - name: Recover independent pre-existing results history for integration
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified_history
          gh run download 45037233530 --repo "$GITHUB_REPOSITORY" \
            --name github-models-v2-abc-complete-45037233530-1 \
            --dir verified_history
          test -s verified_history/data/github_models/verified_results.json
      - name: Prove all four verified external finals settle only exact archived SHADOW selections
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}/shadow_impl:${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from github_models.independent_final_score_bridge import reconcile
          from github_models.shadow_audit import settle_one
          e=json.load(open("data/github_models/independent_final_evidence_2026-11-20.json",encoding="utf-8"))
          original=json.load(open("verified_history/data/github_models/verified_results.json",encoding="utf-8"))
          history,m=reconcile(original,e,"frozen_source",observed_at_utc="2026-11-23T09:00:00Z")
          assert m["new_finished_rows"] == 4
          wanted={x["fixture_id"] for x in e["rows"]}
          for p in Path("frozen_source/queues").glob("*/*.json"):
              q=json.loads(p.read_text(encoding="utf-8"))
              if not wanted.issubset({f["fixture_id"] for f in q["fixtures"]}):
                  continue
              s=Path("frozen_source/shadow")/p.relative_to("frozen_source/queues")
              if not s.exists():
                  continue
              f=json.loads(s.read_text(encoding="utf-8"))
              candidates=[c for c in f["candidates"] if c["fixture_id"] in wanted]
              out=settle_one({"candidates":candidates},q,history,"2026-11-23T09:01:00Z")
              assert len({x["fixture_id"] for x in out})==4
              assert all(x["status"]=="settled" for x in out), [x for x in out if x["status"]!="settled"][:6]
              print("REAL_SHADOW_FIXTURE_SETTLEMENT="+str(len(out)))
              break
          else:
              raise AssertionError("no_original_frozen_queue_matching_all_four")
          PY

      - name: Fetch ONLY already archived odds (no paid API)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TRIGGER_RUN_ID" ]]; then
            run_id="$TRIGGER_RUN_ID"
          else
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow oddspapi-daily.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p input
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name oddspapi-daily --dir input
          test -s input/collection.json
          test -s input/market_gaps.json
          echo "SOURCE_ODDSPAPI_RUN=$run_id"

      - name: Inspect actual bookmaker market identities
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m github_models.market_rule_gate \
            --collection input/collection.json \
            --gaps input/market_gaps.json \
            --output out/MARKET_RULES_AUDIT.json
          test -s out/MARKET_RULES_AUDIT.json
          python - <<'PY'
          import json
          v=json.load(open("out/MARKET_RULES_AUDIT.json",encoding="utf-8"))
          assert v["automatically_promoted_markets"] == []
          assert v["new_paid_api_calls"] == 0
          assert v["snapshots_checked"] > 0
          assert v["quotes_checked"] > 0
          print("MARKET_RULES_SEMANTIC_GATES=PASS")
          PY

      - name: Save technical JSON audit (two user-facing PDFs unchanged)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: multimodel-market-rules-diagnostic
          path: out/MARKET_RULES_AUDIT.json
          if-no-files-found: error
          retention-days: 90
