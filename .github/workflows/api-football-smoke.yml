name: API-Football smoke test

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD"
        required: true
        default: "2026-10-04"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "ERROR: API_FOOTBALL_KEY is missing"
            exit 1
          fi
          echo "API_FOOTBALL_KEY configured correctly."

      - name: Test API-Football
        run: python tools/api_football_probe.py "${{ inputs.date }}"
