name: GitHub Models independent daily fixture queue

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  fixture-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent queue
        run: python -m unittest tests.test_github_models_daily_queue tests.test_github_models_independent_forecasts tests.test_github_models_kb3_history_bridge tests.test_github_models_public_results -v
      - name: Build queue from available pre-match snapshots
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m github_models.daily_queue --as-of "$NOW"
      - name: Fetch observed public historical results (independent of KB3)
        shell: bash
        run: |
          set -euo pipefail
          python -m github_models.public_results
      - name: Run independent research predictions (or explicit blockers)\n        shell: bash\n        run: |\n          set -euo pipefail\n          DAY="$(TZ=Europe/Warsaw date +%F)"\n          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n          python -m github_models.predict --queue "reports/github_models/queues/$DAY.json" --output "reports/github_models/predictions/$DAY.json" --as-of "$NOW"\n      - name: Upload independent research outputs
        uses: actions/upload-artifact@v4
        with:
          name: github-models-fixture-queue
          path: |\n            reports/github_models/queues/*.json\n            reports/github_models/predictions/*.json\n            data/github_models/source_manifest.json
          retention-days: 30
          if-no-files-found: error
