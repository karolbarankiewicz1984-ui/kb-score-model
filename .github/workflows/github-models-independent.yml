name: GitHub Models V2 independent research (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        run: |
          python -m pip install -r github_models/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Full unit and integration regression
        run: python -B -m unittest discover -s tests
      - name: Collect complete independent PitchAPI fixture lists and country metadata
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python -B -m github_models.pitchapi_fixtures --output-dir research_inputs/pitchapi
      - name: Observe public results and actual available event statistics
        run: |
          python -B -m github_models.public_results
          python -B -m github_models.collect_events
      - name: Freeze one cutoff after all source responses
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('FROZEN_AT=' + datetime.now(timezone.utc).isoformat() + '\n')
          PY
      - name: Build queue, audit coverage and generate independent forecasts
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.daily_queue --snapshot-dir research_inputs/pitchapi --as-of "$FROZEN_AT"
          python -B -m github_models.coverage_audit --queue "reports/github_models/queues/$DAY.json" --history data/github_models/verified_results.json --output "reports/github_models/coverage/$DAY.json" --as-of "$FROZEN_AT"
          python -B -m github_models.predict --queue "reports/github_models/queues/$DAY.json" --output "reports/github_models/predictions/$DAY.json" --as-of "$FROZEN_AT"
          python -B -m github_models.market_runner --queue "reports/github_models/queues/$DAY.json" --history data/github_models/verified_results.json --events data/github_models/verified_events.json --as-of "$FROZEN_AT" --output "reports/github_models/markets/$DAY.json"
      - name: Read existing immutable research archives
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: research_archive
          persist-credentials: false
      - name: Prepare research PDF with explicit interpretation and actual sample sizes
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.daily_settlement --archive-dir research_archive --history data/github_models/verified_results.json --events data/github_models/verified_events.json --as-of "$FROZEN_AT" --output reports/github_models/settlement.json
          python -B -m github_models.research_pdf --predictions "reports/github_models/predictions/$DAY.json" --queue "reports/github_models/queues/$DAY.json" --settlement reports/github_models/settlement.json --event-markets "reports/github_models/markets/$DAY.json" --output "reports/github_models/pdf/RESEARCH_$DAY.pdf"
      - name: Apply isolated A/B/C research filters and render PDF
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.abc_report \
            --predictions "reports/github_models/predictions/$DAY.json" \
            --events "reports/github_models/markets/$DAY.json" \
            --queue "reports/github_models/queues/$DAY.json" \
            --output-json "reports/github_models/filters/ABC_$DAY.json" \
            --output-pdf "reports/github_models/pdf/GITHUB_MODELS_V2_ABC_$DAY.pdf"
      - name: Audit frozen A/B/C
        run: |
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.abc_audit_runner --archive-dir research_archive --history data/github_models/verified_results.json --events data/github_models/verified_events.json --as-of "$FROZEN_AT" --output "reports/github_models/filters/AUDIT_$DAY.json"
          python -B -m github_models.abc_audit_pdf --input "reports/github_models/filters/AUDIT_$DAY.json" --output "reports/github_models/pdf/GITHUB_MODELS_V2_AUDIT_$DAY.pdf"
      - name: Upload forecasts, PDF and reproducible source inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-models-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/github_models/queues/*.json
            reports/github_models/predictions/*.json
            reports/github_models/coverage/*.json
            reports/github_models/filters/*.json
            reports/github_models/markets/*.json
            reports/github_models/pdf/*.pdf
            reports/github_models/settlement.json
            data/github_models/source_manifest.json
            data/github_models/events_manifest.json
            data/github_models/verified_results.json
            data/github_models/verified_events.json
            research_inputs/pitchapi/*.json
          retention-days: 30
          if-no-files-found: error
