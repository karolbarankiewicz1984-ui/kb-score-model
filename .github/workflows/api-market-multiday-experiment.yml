name: API Market Scan multi-day experiment
on:
  schedule:
    # Scan starts 10:00 Warsaw (08:00 UTC summer / 09:00 UTC winter).
    # MULTIMODEL ChatGPT PDF delivery remains 11:30 Warsaw; 90-min headroom.
    - cron: '0 8,9 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'First date YYYY-MM-DD (blank = today Europe/Warsaw)'
        required: false
        type: string
      days:
        description: 'Number of consecutive days (1-7)'
        required: true
        default: '3'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7']
permissions:
  contents: read
jobs:
  multiday:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Warsaw schedule (DST-aware and GitHub-delay-safe)
        id: warsaw
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SLOT: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'schedule' ]; then
            # Use the scheduled UTC slot, NOT the actual execution hour: GitHub
            # may delay scheduled jobs by an hour or more. Check DST at the
            # nominal time to run exactly one of the two UTC slots per day.
            case "$CRON_SLOT" in
              '0 8 * * *') UTC_HOUR='08' ;;
              '0 9 * * *') UTC_HOUR='09' ;;
              *) echo "::error::Unexpected scheduler slot: $CRON_SLOT"; exit 1 ;;
            esac
            UTC_DATE=$(date -u +%F)
            LOCAL_HOUR=$(TZ=Europe/Warsaw date -d "$UTC_DATE $UTC_HOUR:00 UTC" +%H)
            if [ "$LOCAL_HOUR" != '10' ]; then
              echo "::notice::Opposite DST slot skipped by design: $CRON_SLOT"
              echo 'run_scan=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Nominal 10:00 Warsaw slot accepted even when GitHub launches late."
          fi
          echo 'run_scan=true' >> "$GITHUB_OUTPUT"
      - name: Check out experimental scan code
        if: steps.warsaw.outputs.run_scan == 'true'
        uses: actions/checkout@v4
        with:
          ref: experiment/api-market-2-playable-odds
      - name: Fetch read-only PitchAPI snapshots from main
        if: steps.warsaw.outputs.run_scan == 'true'
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          mkdir -p data/pitchapi/prematch
      - name: Prepare read-only PitchAPI goal commentary
        if: steps.warsaw.outputs.run_scan == 'true'
        run: |
          # Import ONLY standalone, scoring-free context helpers from main.
          for helper in pitchapi_xg_lab.py pitchapi_prematch_context.py pitchapi_market_validation.py; do
            git show "origin/main:tools/$helper" > "tools/$helper"
          done
      - name: Test experimental date planner and market filters
        if: steps.warsaw.outputs.run_scan == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_api_market_multiday_dates.py' -v
          python -m unittest discover -s tests -p 'test_api_market_playable_shadow.py' -v
      - name: Install PDF dependency
        if: steps.warsaw.outputs.run_scan == 'true'
        run: python -m pip install 'reportlab>=4,<5'
      - name: Independent scan per date
        if: steps.warsaw.outputs.run_scan == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -u
          test -n "$API_FOOTBALL_KEY" || { echo "Missing API_FOOTBALL_KEY"; exit 1; }
          mkdir -p reports/api_market_scan/multiday_status
          args=(--days "${DAYS:-3}")
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          python tools/api_market_multiday_dates.py "${args[@]}" > /tmp/api_scan_dates.txt
          failed_days=0
          while IFS= read -r target; do
            # Snapshot from main is optional and read-only. We do not alter scores.
            if git show "origin/main:data/pitchapi/prematch/$target.json" > "data/pitchapi/prematch/$target.json" 2>/dev/null; then
              echo "PitchAPI context available for $target"
            else
              rm -f "data/pitchapi/prematch/$target.json"
              echo "PitchAPI context absent for $target; report stays unchanged"
            fi
            echo "::group::API Market Scan $target"
            if python tools/api_national_today_prefetch.py "$target" &&
               python tools/api_market_scan.py "$target" &&
               python tools/api_market_v3_enrich.py "$target" &&
               python tools/api_market_report_diversify.py "$target" &&
               python tools/api_market_playable_shadow.py "$target" &&
               python tools/api_market_freeze.py "$target" &&
               python tools/api_market_to_pdf.py "$target"; then
              printf '{"date":"%s","status":"ok"}\n' "$target" > "reports/api_market_scan/multiday_status/$target.json"
            else
              printf '{"date":"%s","status":"error","reason":"Scan failed; see logs"}\n' "$target" > "reports/api_market_scan/multiday_status/$target.json"
              echo "::error::Scan failed for $target; see logs and dated status JSON."
              failed_days=$((failed_days + 1))
            fi
            echo "::endgroup::"
          done < /tmp/api_scan_dates.txt
          if [ "$failed_days" -gt 0 ]; then
            echo "::error::$failed_days of ${DAYS:-3} dates failed. Workflow marked failed; available reports are still uploaded."
            exit 1
          fi
      - name: Upload dated reports and statuses
        if: always() && steps.warsaw.outputs.run_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-market-multiday-experiment
          path: |
            reports/api_market_scan/v2/API_MARKET_SCAN_PLAYABLE_*.md
            reports/api_market_scan/v2/API_MARKET_SCAN_PLAYABLE_*.json
            reports/api_market_scan/multiday_status/*.json
            reports/api_market_scan/pdf/API_MARKET_SCAN_*.pdf
            reports/api_market_scan/audit_input/*.json
          if-no-files-found: warn
