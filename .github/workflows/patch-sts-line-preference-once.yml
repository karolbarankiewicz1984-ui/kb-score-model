name: Patch STS line preference once
on:
  push:
    paths:
      - '.github/workflows/patch-sts-line-preference-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch line ranking and PDF profile label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/api_market_scan.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''def market_key(candidate):\n    return f"{candidate['fixture_id']}|{candidate['team_id']}|{candidate['market']}|{candidate['line']:.1f}"\n\n\n'''
          insert = '''def sts_line_preference(market, line):\n    """Prefer practical STS-like lines within the same team/market family.\n\n    This affects which candidate line is carried forward, not the API PURE\n    calculation itself. Unknown/specialist markets keep neutral preference.\n    """\n    line = float(line)\n    preferences = {\n        "yellow": {1.5: 5, 2.5: 4, 3.5: 3, 0.5: 0},\n        "corners": {3.5: 5, 4.5: 4, 5.5: 3, 6.5: 2, 7.5: 1, 2.5: 0},\n        "team_goals": {0.5: 5, 1.5: 4, 2.5: 3},\n    }\n    return preferences.get(market, {}).get(line, 1)\n\n\n'''
          if 'def sts_line_preference(' not in s:
              if anchor not in s:
                  raise SystemExit('market_key anchor not found')
              s = s.replace(anchor, anchor + insert, 1)

          old = '''        offered = 1 if item["market_data"].get("exact_line_available") else 0\n        rank = (offered, item["market_adjusted_pct"], item["api_pure_pct"], item["confidence_api"], item["line"])\n'''
          new = '''        offered = 1 if item["market_data"].get("exact_line_available") else 0\n        practical = sts_line_preference(item["market"], item["line"])\n        rank = (practical, offered, item["market_adjusted_pct"], item["api_pure_pct"], item["confidence_api"], item["line"])\n'''
          if old not in s:
              raise SystemExit('new rank target not found')
          s = s.replace(old, new, 1)

          old2 = '''            old_rank = (1 if old["market_data"].get("exact_line_available") else 0, old["market_adjusted_pct"], old["api_pure_pct"], old["confidence_api"], old["line"])\n'''
          new2 = '''            old_rank = (sts_line_preference(old["market"], old["line"]), 1 if old["market_data"].get("exact_line_available") else 0, old["market_adjusted_pct"], old["api_pure_pct"], old["confidence_api"], old["line"])\n'''
          if old2 not in s:
              raise SystemExit('old rank target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tools/render_api_market_pdf.py')
          r = p.read_text(encoding='utf-8')
          old = '''            f"Nierozpoczęte mecze: <b>{payload.get('fixtures_scanned', 0)}</b> &nbsp;&nbsp; | &nbsp;&nbsp; "\n            f"historia: <b>{payload.get('history_matches_loaded', 0)}</b> meczów &nbsp;&nbsp; | &nbsp;&nbsp; pozycje: <b>{len(positions)}</b><br/>"\n            "API PURE = czysta historia. Ocena końcowa = wynik po sprawdzeniu wiarygodności próby, rodzaju rozgrywek, rynku i dostępnego bieżącego kontekstu.",\n'''
          new = '''            f"Nierozpoczęte mecze: <b>{payload.get('fixtures_scanned', 0)}</b> &nbsp;&nbsp; | &nbsp;&nbsp; "\n            f"historia: <b>{payload.get('history_matches_loaded', 0)}</b> meczów &nbsp;&nbsp; | &nbsp;&nbsp; pozycje: <b>{len(positions)}</b><br/>"\n            "Profil użytkowy: <b>STS</b>. API PURE = czysta historia. Ocena końcowa = wynik po sprawdzeniu wiarygodności próby, rodzaju rozgrywek, rynku i dostępnego bieżącego kontekstu.",\n'''
          if old in r:
              r = r.replace(old, new, 1)
          p.write_text(r, encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/patch-sts-line-preference-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api_market_scan.py tools/render_api_market_pdf.py .github/workflows/patch-sts-line-preference-once.yml
          git commit -m "feat: prefer practical STS lines in API scan"
          git pull --rebase origin main
          git push origin main
