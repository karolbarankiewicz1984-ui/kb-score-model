name: MM panel automatic prepare tests
on:
  pull_request:
    paths:
      - 'tools/panel_auto_prepare.py'
      - 'tests/test_panel_auto_prepare.py'
      - '.github/workflows/mm-panel-auto-prepare-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_panel_auto_prepare.py -v
