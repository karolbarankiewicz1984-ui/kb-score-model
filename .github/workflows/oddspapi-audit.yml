name: MULTIMODEL V2 - OddsPapi historical bookmaker audit (daily)
on:
  schedule:
    - cron: '10 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oddspapi-audit.yml'
      - 'github_models/priced_shadow_settlement.py'
      - 'github_models/independent_final_score_bridge.py'
      - 'data/github_models/independent_final_evidence_2026-11-20.json'
      - 'github_models/multimodel_calibration_gate.py'
      - 'research/multimodel/non_pl_opta_source_inventory_20261123.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: oddspapi-historical-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9aa94343efff7911fddcf5957b31884e150fc31
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report PDF support
        run: |
          python -m pip install reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core poppler-utils
      - name: Recover up to 35 latest exact-odds frozen archive artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_inputs
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=oddspapi-daily&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id] | @tsv' \
            | sort -nr | head -n 35 > /tmp/odds-artifacts.tsv || true
          while IFS=$'\t' read -r artifact_id run_id; do
            if [[ -n "$run_id" ]]; then
              mkdir -p "audit_inputs/$run_id"
              gh run download "$run_id" --name oddspapi-daily --dir "audit_inputs/$run_id" \
                || echo "ARCHIVE_DOWNLOAD_FAILED=$run_id"
            fi
          done < /tmp/odds-artifacts.tsv
          echo "ARCHIVED_OVERLAYS=$(find audit_inputs -name market_overlay.json | wc -l)"
      - name: Fetch independently observable final scores and event statistics
        shell: bash
        run: |
          set -euo pipefail
          python -B -m github_models.oddspapi_outcomes --outdir reports/oddspapi_audit/outcomes
      - name: Checkout exact SHADOW/Asian-handicap settlement extension
        uses: actions/checkout@v4
        with:
          ref: main
          path: priced_impl
          persist-credentials: false
      - name: Checkout frozen SHADOW outcome resolver, unchanged
        uses: actions/checkout@v4
        with:
          ref: codex/multimodel-v2
          path: shadow_impl
          persist-credentials: false
      - name: Checkout immutable research inputs for matching
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: frozen_source
          persist-credentials: false
      - name: Add four strictly reviewed independent scores only if source CSV is missing them
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -B priced_impl/github_models/independent_final_score_bridge.py \
            --history reports/oddspapi_audit/outcomes/verified_results.json \
            --evidence priced_impl/data/github_models/independent_final_evidence_2026-11-20.json \
            --frozen-dir frozen_source \
            --as-of "$NOW" \
            --out reports/oddspapi_audit/outcomes/verified_results_extended.json \
            --manifest reports/oddspapi_audit/outcomes/independent_final_bridge_manifest.json
          test -s reports/oddspapi_audit/outcomes/verified_results_extended.json
          test -s reports/oddspapi_audit/outcomes/independent_final_bridge_manifest.json
      - name: Report sourced HF/AF and HY/AY coverage by league (never Opta equivalence)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/priced_impl
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -B -m github_models.disciplinary_source_coverage \
            --events reports/oddspapi_audit/outcomes/verified_events.json \
            --source-manifest reports/oddspapi_audit/outcomes/source_manifest.json \
            --opta-scope priced_impl/research/multimodel/non_pl_opta_source_inventory_20261123.json \
            --as-of "$NOW" \
            --out reports/oddspapi_audit/DISCIPLINARY_SOURCE_COVERAGE.json
          python - <<'PY'
          import json
          r=json.load(open('reports/oddspapi_audit/DISCIPLINARY_SOURCE_COVERAGE.json'))
          assert r['market_promotion_allowed'] is False
          assert r['paid_oddspapi_calls'] == 0
          assert r['opta_non_pl_verified_foul_matches'] == 0
          print('DISCIPLINARY_COVERAGE_EVIDENCE=PASS')
          PY
      - name: Replay A/B/C against independent results and freeze original pre-match quotes
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -B -m github_models.oddspapi_replay_audit \
            --archive-dir audit_inputs \
            --history reports/oddspapi_audit/outcomes/verified_results_extended.json \
            --events reports/oddspapi_audit/outcomes/verified_events.json \
            --as-of "$NOW" \
            --out reports/oddspapi_audit/REPLAY_AUDIT.json
          python -B -m github_models.oddspapi_audit_pdf \
            --input reports/oddspapi_audit/REPLAY_AUDIT.json \
            --output reports/oddspapi_audit/MULTIMODEL_V2_SUPERBET_AUDIT.pdf
          pdfinfo reports/oddspapi_audit/MULTIMODEL_V2_SUPERBET_AUDIT.pdf | grep 'Pages:'
      - name: Prospectively settle only exact BTTS and half-goal Asian-handicap quotes
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/priced_impl:${{ github.workspace }}/shadow_impl:${{ github.workspace }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -B -m github_models.priced_shadow_settlement \
            --archive-dir audit_inputs \
            --frozen-dir frozen_source \
            --history reports/oddspapi_audit/outcomes/verified_results_extended.json \
            --as-of "$NOW" \
            --out reports/oddspapi_audit/PRICED_SHADOW_SETTLEMENT.json
          test -s reports/oddspapi_audit/PRICED_SHADOW_SETTLEMENT.json
          python - <<'PY'
          import json
          r=json.load(open('reports/oddspapi_audit/PRICED_SHADOW_SETTLEMENT.json',encoding='utf-8'))
          assert r['production_promotion'] is False
          assert r['paid_api_calls'] == 0
          assert r['official_bookmaker_payout_confirmed'] is False
          assert r['fouls_superbet_equivalent'] is False
          assert r['cards_bookings_equivalent'] is False
          print('PRICED_SHADOW_SETTLEMENT_GATES=PASS')
          PY

      - name: Audit distinct-fixture sample size and block premature calibration
        shell: bash
        run: |
          set -euo pipefail
          python -B priced_impl/github_models/multimodel_calibration_gate.py \
            --replay reports/oddspapi_audit/REPLAY_AUDIT.json \
            --shadow reports/oddspapi_audit/PRICED_SHADOW_SETTLEMENT.json \
            --opta-scope priced_impl/research/multimodel/non_pl_opta_source_inventory_20261123.json \
            --out reports/oddspapi_audit/MULTIMODEL_CALIBRATION_READINESS.json
          python - <<'PY'
          import json
          v=json.load(open("reports/oddspapi_audit/MULTIMODEL_CALIBRATION_READINESS.json"))
          assert v["model_weights_changed"] is False
          assert v["calibration_authorized"] is False
          assert v["bookmaker_payout_confirmed"] is False
          print("MULTIMODEL_CALIBRATION_READINESS=PASS")
          PY
      - name: Preserve independent source manifest and audited metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-rolling-audit
          path: |
            reports/oddspapi_audit/REPLAY_AUDIT.json
            reports/oddspapi_audit/PRICED_SHADOW_SETTLEMENT.json
            reports/oddspapi_audit/MULTIMODEL_V2_SUPERBET_AUDIT.pdf
            reports/oddspapi_audit/outcomes/source_manifest.json
            reports/oddspapi_audit/outcomes/independent_final_bridge_manifest.json
            reports/oddspapi_audit/MULTIMODEL_CALIBRATION_READINESS.json
            reports/oddspapi_audit/DISCIPLINARY_SOURCE_COVERAGE.json
          if-no-files-found: ignore
          retention-days: 90
