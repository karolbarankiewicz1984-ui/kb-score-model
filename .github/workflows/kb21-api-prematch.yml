name: KB21 API pre-match inputs
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (blank = today)'
        required: false
        type: string
  schedule:
    - cron: '45 8 * * *'
permissions:
  contents: write
concurrency:
  group: kb21-api-prematch-inputs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test independent calendar adapter
        run: python -m unittest tests.test_kb21_football_data_org tests.test_kb21_coverage_audit -v
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Read API pre-match data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m tools.kb21_api_prematch --date "${{ inputs.date }}"
          else
            python -m tools.kb21_api_prematch
          fi
      - name: Build isolated API diagnostic
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          python -m tools.kb21_api_diagnostic "data/api_football/kb21_inputs/$DATE.json" --output "reports/kb21_diagnostic/$DATE.json"
      - name: Audit KB21 readiness blockers
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          python -m tools.kb21_gate_audit "data/api_football/kb21_inputs/$DATE.json" --output "reports/kb21_gate/$DATE.json"
      - name: Refresh independent fixture calendar
        continue-on-error: true
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          rm -f "data/football_data_org/$DATE.json" "reports/kb21_calendar/$DATE.json"
          if [ -n "$FOOTBALL_DATA_ORG_KEY" ]; then
            python -m tools.kb21_football_data_org --date "$DATE" --target-competitions
          else
            echo "Independent calendar unavailable; comparison remains blocked"
          fi
      - name: Diagnose independent calendar competition coverage
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          if [ -f data/football_data_org/coverage.json ]; then
            python -m tools.kb21_coverage_audit "data/api_football/kb21_inputs/$DATE.json" data/football_data_org/coverage.json --output "reports/kb21_coverage/$DATE.json"
          fi
      - name: Compare independent fixture calendar (review only)
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          INDEPENDENT="data/football_data_org/$DATE.json"
          if [ -f "$INDEPENDENT" ]; then
            mkdir -p reports/kb21_calendar
            python -m tools.kb21_independent_calendar "data/api_football/kb21_inputs/$DATE.json" "$INDEPENDENT" --output "reports/kb21_calendar/$DATE.json"
          else
            echo "Independent calendar not yet available; no verification granted"
          fi
      - name: Write readable KB21 readiness summary
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          python -m tools.kb21_readiness_summary "reports/kb21_gate/$DATE.json" "reports/kb21_calendar/$DATE.json" "reports/kb21_readiness/$DATE.md"
      - name: Publish KB21 diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kb21-input-audit
          path: |
            reports/kb21_diagnostic/*.json
            reports/kb21_gate/*.json
            reports/kb21_calendar/*.json
            reports/kb21_coverage/*.json
            reports/kb21_readiness/*.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit factual snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/kb21_inputs reports/kb21_diagnostic reports/kb21_gate
          if [ -d data/football_data_org ]; then git add data/football_data_org; fi
          git add -u
          if [ -d reports/kb21_calendar ]; then git add reports/kb21_calendar; fi
          if [ -d reports/kb21_coverage ]; then git add reports/kb21_coverage; fi
          if [ -d reports/kb21_readiness ]; then git add reports/kb21_readiness; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: KB21 pre-match API candidate inputs"
          git pull --rebase
          git push
