name: KB21 API pre-match inputs
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (blank = today)'
        required: false
        type: string
  schedule:
    - cron: '45 8 * * *'
permissions:
  contents: write
concurrency:
  group: kb21-api-prematch-inputs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Read API pre-match data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m tools.kb21_api_prematch --date "${{ inputs.date }}"
          else
            python -m tools.kb21_api_prematch
          fi
      - name: Build isolated API diagnostic
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          python -m tools.kb21_api_diagnostic "data/api_football/kb21_inputs/$DATE.json" --output "reports/kb21_diagnostic/$DATE.json"
      - name: Audit KB21 readiness blockers
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          python -m tools.kb21_gate_audit "data/api_football/kb21_inputs/$DATE.json" --output "reports/kb21_gate/$DATE.json"
      - name: Compare independent fixture calendar (review only)
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Warsaw date +%F)"; fi
          INDEPENDENT="data/football_data_org/$DATE.json"
          if [ -f "$INDEPENDENT" ]; then
            mkdir -p reports/kb21_calendar
            python -m tools.kb21_independent_calendar "data/api_football/kb21_inputs/$DATE.json" "$INDEPENDENT" --output "reports/kb21_calendar/$DATE.json"
          else
            echo "Independent calendar not yet available; no verification granted"
          fi
      - name: Commit factual snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/kb21_inputs reports/kb21_diagnostic reports/kb21_gate
          if [ -d reports/kb21_calendar ]; then git add reports/kb21_calendar; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: KB21 pre-match API candidate inputs"
          git pull --rebase
          git push
