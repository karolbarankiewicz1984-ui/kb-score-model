name: KB21 API pre-match inputs
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (blank = today)'
        required: false
        type: string
  schedule:
    - cron: '20 8 * * *'
permissions:
  contents: write
concurrency:
  group: kb21-api-prematch-inputs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Read API pre-match data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m tools.kb21_api_prematch --date "${{ inputs.date }}"
          else
            python -m tools.kb21_api_prematch
          fi
      - name: Commit factual snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/kb21_inputs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: KB21 pre-match API candidate inputs"
          git push
