name: GitHub Models V2 — A/B/C | daily forecast and audit
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-models-v2-daily-audit.yml'

permissions:
  contents: write

concurrency:
  group: github-models-v2-abc-seven-day
  cancel-in-progress: false

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/multimodel-v2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: |
          python -m pip install -r github_models/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Collect independent fixtures and observed results
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -B -m github_models.pitchapi_fixtures --output-dir research_inputs/pitchapi --days 7
          python -B -m github_models.public_results
          python -B -m github_models.collect_events
      - name: Upload 7-day PitchAPI source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-models-v2-pitchapi-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_inputs/pitchapi/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Freeze the input cutoff
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("FROZEN_AT="+datetime.now(timezone.utc).isoformat()+"\n")
          PY
      - name: Generate independent forecasts for upcoming fixtures
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.daily_queue --snapshot-dir research_inputs/pitchapi --as-of "$FROZEN_AT" --days 7
          python -B -m github_models.coverage_audit --queue "reports/github_models/queues/$DAY.json" --history data/github_models/verified_results.json --output "reports/github_models/coverage/$DAY.json" --as-of "$FROZEN_AT"
          python -B -m github_models.predict --queue "reports/github_models/queues/$DAY.json" --output "reports/github_models/predictions/$DAY.json" --as-of "$FROZEN_AT"
          python -B -m github_models.market_runner --queue "reports/github_models/queues/$DAY.json" --history data/github_models/verified_results.json --events data/github_models/verified_events.json --as-of "$FROZEN_AT" --output "reports/github_models/markets/$DAY.json"
      # Operator-initiated one-off diagnostic (24 Nov): this workflow's existing
      # push-path trigger initiates one NORMAL ABC run after merge. This does not
      # add a daily schedule or make new paid OddsPapi requests by itself.
      - name: Verify Warsaw-day frozen ABC queue and preserve source health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          zone=ZoneInfo("Europe/Warsaw")
          day=datetime.now(zone).date()
          path=Path("reports/github_models/queues")/(str(day)+".json")
          if not path.is_file():
              raise SystemExit("ABC_SOURCE_BLOCKED: missing_today_frozen_queue")
          q=json.loads(path.read_text(encoding="utf-8"))
          stamp=q.get("generated_at_utc")
          cutoff=os.environ["FROZEN_AT"]
          if q.get("schema")!="github-models-fixture-queue-v1" or stamp!=cutoff:
              raise SystemExit("ABC_SOURCE_BLOCKED: wrong_queue_schema_or_cutoff")
          at=datetime.fromisoformat(cutoff.replace("Z","+00:00"))
          now=datetime.now(timezone.utc)
          expected=[str(day+timedelta(days=i)) for i in range(7)]
          if (at.tzinfo is None or at>now or now-at>timedelta(hours=6)
                  or at.astimezone(zone).date()!=day or q.get("dates")!=expected):
              raise SystemExit("ABC_SOURCE_BLOCKED: stale_or_wrong_warsaw_dates")
          fixtures=q.get("fixtures")
          if not isinstance(fixtures,list):
              raise SystemExit("ABC_SOURCE_BLOCKED: malformed_fixture_queue")
          counts={d:0 for d in expected}
          ids=set()
          for f in fixtures:
              if not isinstance(f,dict) or not f.get("fixture_id"):
                  raise SystemExit("ABC_SOURCE_BLOCKED: missing_fixture_id")
              fid=str(f["fixture_id"])
              if fid in ids:
                  raise SystemExit("ABC_SOURCE_BLOCKED: duplicate_fixture_id")
              ids.add(fid)
              kick=datetime.fromisoformat(f["kickoff_utc"].replace("Z","+00:00"))
              if kick.tzinfo is None or kick<=at:
                  raise SystemExit("ABC_SOURCE_BLOCKED: kickoff_not_future_at_freeze")
              local=str(kick.astimezone(zone).date())
              if local not in counts:
                  raise SystemExit("ABC_SOURCE_BLOCKED: outside_seven_day_queue")
              counts[local]+=1
          health={"schema":"multimodel-abc-fresh-source-health-v1",
                  "day":str(day),"source_cutoff_utc":at.isoformat(),
                  "checked_at_utc":now.isoformat(),"queue_rows":len(fixtures),
                  "fixtures_by_warsaw_day":counts,
                  "today_fixtures":counts[str(day)],
                  "missing_dates":q.get("missing_dates",[]),
                  "invalid_dates":q.get("invalid_dates",[]),
                  "partial_dates":q.get("partial_dates",[]),
                  "status":"CURRENT_SOURCE_VALIDATED" if counts[str(day)] else
                           "NO_TODAY_FIXTURES_BUT_FUTURE_DATES_VALID",
                  "paid_oddspapi_calls":0}
          out=Path("reports/github_models/coverage")/("CYCLE_SOURCE_HEALTH_"+str(day)+".json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(health,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print("ABC_SOURCE_HEALTH="+json.dumps(health,ensure_ascii=False))
          if counts[str(day)]==0:
              print("::warning::ABC source has no future fixtures today; do not force old bookmaker prices")
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as s:
                  s.write("\\n### ABC source chronology\\n")
                  s.write(f"- Day: {day}; frozen cutoff: {at.isoformat()}\\n")
                  s.write(f"- Fixtures today: {counts[str(day)]}; total 7 days: {len(fixtures)}\\n")
                  s.write(f"- Status: {health['status']}\\n")
          PY
      # Publish forecasts as soon as they are computed; never block on slow historical audits.
      - name: Render GitHub Models V2 A/B/C PDF and freeze complete JSON
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.abc_report \
            --predictions "reports/github_models/predictions/$DAY.json" \
            --events "reports/github_models/markets/$DAY.json" \
            --queue "reports/github_models/queues/$DAY.json" \
            --output-json "reports/github_models/filters/ABC_$DAY.json" \
            --output-pdf "reports/github_models/pdf/GITHUB_MODELS_V2_ABC_$DAY.pdf"
          test -s "reports/github_models/filters/ABC_$DAY.json"
          test -s "reports/github_models/pdf/GITHUB_MODELS_V2_ABC_$DAY.pdf"

          # Create seven Polish local-calendar reports from the SAME frozen
          # research queue/forecasts, without additional API or re-estimation.
          python -B -m github_models.weekly_reports \
            --root reports/github_models --day "$DAY" --days 7
          test -s "reports/github_models/filters/SEVEN_DAY_MANIFEST_$DAY.json"
      - name: Generate independent SHADOW BTTS / handicap and seven daily PDFs
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.shadow_runner \
            --queue "reports/github_models/queues/$DAY.json" \
            --history data/github_models/verified_results.json \
            --as-of "$FROZEN_AT" \
            --output "reports/github_models/shadow/$DAY.json"
          python -B -m github_models.shadow_reports \
            --root reports/github_models --day "$DAY" --days 7
          test -s "reports/github_models/shadow/SHADOW_MANIFEST_$DAY.json"

      - name: Publish today's PDF and sources BEFORE historical audit
        uses: actions/upload-artifact@v4
        with:
          name: github-models-v2-abc-forecast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/github_models/queues/*.json
            reports/github_models/predictions/*.json
            reports/github_models/coverage/*.json
            reports/github_models/markets/*.json
            reports/github_models/filters/ABC_*.json
            reports/github_models/filters/SEVEN_DAY_MANIFEST_*.json
            reports/github_models/pdf/GITHUB_MODELS_V2_ABC_*.pdf
            reports/github_models/pdf/MULTIMODEL_V2_SHADOW_*.pdf
            reports/github_models/shadow/*.json
            data/github_models/source_manifest.json
            data/github_models/events_manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Read immutable research archives
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: research_archive
          persist-credentials: false
      - name: Preserve new research snapshots immutably
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: archive_write
          persist-credentials: true
      - name: Store today's pre-match forecasts in research archive
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          RUN_ID="$GITHUB_RUN_ID"
          for spec in "predictions frozen" "queues queues" "markets markets"; do
            set -- $spec
            source_file="reports/github_models/$1/$DAY.json"
            target="archive_write/$2/$DAY/$RUN_ID.json"
            test -s "$source_file"
            if test -e "$target"; then
              echo "::error::Frozen archive entry already exists: $target"
              exit 1
            fi
            mkdir -p "$(dirname "$target")"
            cp "$source_file" "$target"
          done
          git -C archive_write config user.name "github-actions[bot]"
          git -C archive_write config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive_write add "frozen/$DAY/$RUN_ID.json" "queues/$DAY/$RUN_ID.json" "markets/$DAY/$RUN_ID.json"
          # SHADOW is optional: missing new-market inputs must not stop A/B/C.
          if test -s "reports/github_models/shadow/$DAY.json"; then
            target="archive_write/shadow/$DAY/$RUN_ID.json"
            if test -e "$target"; then
              echo "::error::Frozen SHADOW entry already exists: $target"
              exit 1
            fi
            mkdir -p "$(dirname "$target")"
            cp "reports/github_models/shadow/$DAY.json" "$target"
            git -C archive_write add "shadow/$DAY/$RUN_ID.json"
          else
            echo "::warning::SHADOW source unavailable; original frozen A/B/C still archived"
          fi
          git -C archive_write commit -m "freeze: research forecast $DAY run $RUN_ID"
          git -C archive_write push origin HEAD:research/github-models-frozen
      - name: Prepare independently verified public results for settlement (no API-Football)
        shell: bash
        run: |
          set -euo pipefail
          test -s data/github_models/verified_results.json
          test -s data/github_models/verified_events.json
          cp data/github_models/verified_results.json data/github_models/settlement_verified_results.json
          cp data/github_models/verified_events.json data/github_models/settlement_verified_events.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = {"schema":"v2-postmatch-public-verified-v1","status":"ok","provider":"football-data.co.uk and configured public CSV sources","api_football_used":False,"note":"Only independently collected observed results/events; missing market statistics remain missing, never inferred.","observed_at_utc":datetime.now(timezone.utc).isoformat()}
          Path("reports/github_models/api_final_manifest.json").parent.mkdir(parents=True,exist_ok=True)
          Path("reports/github_models/api_final_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          PY
      - name: Set post-result audit cutoff
        shell: bash
        run: echo "AUDIT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Audit previous predictions and settle A/B/C
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          # Full frozen settlement already runs in the independent smoke workflow.
          # Do not compute it twice here; A/B/C audit settles the exact same records.
          python -B -m github_models.abc_audit_runner --archive-dir research_archive --history data/github_models/settlement_verified_results.json --events data/github_models/settlement_verified_events.json --as-of "$AUDIT_AT" --output "reports/github_models/filters/AUDIT_$DAY.json"
          python -B -m github_models.abc_audit_pdf --input "reports/github_models/filters/AUDIT_$DAY.json" --output "reports/github_models/pdf/GITHUB_MODELS_V2_AUDIT_$DAY.pdf"
      - name: Audit independently frozen SHADOW BTTS / handicap results
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -B -m github_models.shadow_audit \
            --archive-dir research_archive \
            --history data/github_models/settlement_verified_results.json \
            --as-of "$AUDIT_AT" \
            --output "reports/github_models/shadow/SHADOW_AUDIT_$DAY.json"

      - name: Archive outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-models-v2-abc-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/github_models/queues/*.json
            reports/github_models/predictions/*.json
            reports/github_models/markets/*.json
            reports/github_models/coverage/*.json
            reports/github_models/shadow/*.json
            reports/github_models/filters/*.json
            reports/github_models/pdf/*.pdf
            reports/github_models/settlement.json
            reports/github_models/api_final_manifest.json
            data/github_models/settlement_verified_results.json
            data/github_models/settlement_verified_events.json
            data/github_models/verified_results.json
            data/github_models/verified_events.json
          retention-days: 30
          if-no-files-found: error
