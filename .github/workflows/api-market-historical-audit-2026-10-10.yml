name: Historical API Market Audit 2026-10-10
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated audit code
        uses: actions/checkout@v4
        with:
          ref: experiment/api-market-2-playable-odds
      - name: Dependencies
        run: python -m pip install 'reportlab>=4,<5'
      - name: Download ORIGINAL 2026-10-09 scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/original
          gh run download 37932224214 -n api-market-multiday-experiment -D /tmp/original
          find /tmp/original -type f
          test -s /tmp/original/v2/API_MARKET_SCAN_PLAYABLE_2026-10-10.md
      - name: Reconstruct and settle 98 picks
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY"
          python tools/api_market_historical_reconstruct.py --markdown /tmp/original/v2/API_MARKET_SCAN_PLAYABLE_2026-10-10.md --output /tmp/reconstructed.json
          python tools/api_market_audit.py 2026-10-10 --input /tmp/reconstructed.json
          cp /tmp/reconstructed.json reports/api_market_scan/audit/RECONSTRUCTED_2026-10-10.json
          test -s reports/api_market_scan/audit/API_MARKET_AUDIT_2026-10-10.pdf
      - name: Upload PDF and detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-api-market-audit-2026-10-10
          path: reports/api_market_scan/audit/*
          if-no-files-found: warn
