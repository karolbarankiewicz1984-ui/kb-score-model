name: Optimize API v3 national cache once
on:
  push:
    paths:
      - '.github/workflows/optimize-v3-national-cache-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch national cache scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/api_market_v3_enrich.py')
          s = p.read_text(encoding='utf-8')
          old = "    base_rows = v2.load_rows()\n    national_refresh = refresh_national_history(fixtures_all, base_rows)\n    rows = merge_rows(base_rows, load_dynamic_rows())\n\n    raw_positions = base.get(\"background_candidates\") or base.get(\"top_positions\") or []\n    context = fetch_context(fixture_map, raw_positions)\n"
          new = "    raw_positions = base.get(\"background_candidates\") or base.get(\"top_positions\") or []\n    relevant_fixtures = []\n    seen_fixtures = set()\n    for item in raw_positions:\n        fid = item.get(\"fixture_id\")\n        fixture = fixture_map.get(fid)\n        if fixture and fid not in seen_fixtures:\n            relevant_fixtures.append(fixture)\n            seen_fixtures.add(fid)\n\n    base_rows = v2.load_rows()\n    # Build dynamic last-20 history only for teams that survived the raw API PURE sieve.\n    national_refresh = refresh_national_history(relevant_fixtures, base_rows)\n    rows = merge_rows(base_rows, load_dynamic_rows())\n\n    context = fetch_context(fixture_map, raw_positions)\n"
          if old not in s:
              raise SystemExit('target v3 main block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/optimize-v3-national-cache-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api_market_v3_enrich.py .github/workflows/optimize-v3-national-cache-once.yml
          git commit -m "perf: limit national last-20 cache to API PURE candidates"
          git pull --rebase origin main
          git push origin main
