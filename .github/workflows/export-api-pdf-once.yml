name: Export API PDF once
on:
  push:
    paths:
      - '.github/workflows/export-api-pdf-once.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify today's PDF
        run: test -f reports/api_market_scan/API_MARKET_SCAN_2026-10-05.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: API_MARKET_SCAN_2026-10-05
          path: reports/api_market_scan/API_MARKET_SCAN_2026-10-05.pdf
          if-no-files-found: error
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/export-api-pdf-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-shot API PDF exporter"
          git push origin main
