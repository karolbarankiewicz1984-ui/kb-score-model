name: PitchAPI xG lab - isolated history

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD; leave blank for yesterday Europe/Warsaw'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/pitchapi-xg-lab.yml'

permissions:
  contents: write

concurrency:
  group: pitchapi-xg-lab
  cancel-in-progress: false

jobs:
  collect-and-compare:
    name: Independent xG audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standalone pairing and xG regression tests
        run: python -m unittest tests.test_pitchapi_xg_lab -v
      - name: Install pinned official PitchAPI SDK
        run: python -m pip install --disable-pip-version-check pitchapi==0.1.6
      - name: Check secret and collect post-match xG
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          REQUEST_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ -z "$PITCHAPI_API_KEY" ]; then
            echo "::error::Missing GitHub secret PITCHAPI_API_KEY"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # Initial pilot date with a known existing API-Football snapshot
            python -m tools.pitchapi_xg_lab --date 2026-10-14
          elif [ -n "$REQUEST_DATE" ]; then
            python -m tools.pitchapi_xg_lab --date "$REQUEST_DATE"
          else
            python -m tools.pitchapi_xg_lab
          fi
      - name: Display audit metrics and isolation
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          files = sorted(glob.glob('reports/pitchapi/*.json'))
          if not files:
              raise SystemExit('Missing comparison report')
          p = json.load(open(files[-1], encoding='utf-8'))
          lines = [
              '# PitchAPI historical xG comparison',
              '',
              '| Metric | Value |',
              '|---|---:|',
              f"| Date | {p['date']} |",
              f"| PitchAPI matches | {p['pitchapi_fixtures']} |",
              f"| API-Football fixtures | {p['api_football_fixtures']} |",
              f"| One-to-one linked fixtures | {p['matched']} |",
              f"| Historical xG-ready fixtures | {p['usable_for_historical_calibration']} |",
              f"| Score conflicts | {p['score_mismatches']} |",
              f"| API-Football unmatched | {p['unmatched_api_football']} |",
              '',
              '**Isolation:** KB Score and API Market engines untouched; KB N and DEV N unchanged.',
              '',
              f"Report: reports/pitchapi/{p['date']}.md",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - name: Upload isolated raw and comparison data
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-xg-audit
          path: |
            data/pitchapi/daily/*.json
            reports/pitchapi/*.json
            reports/pitchapi/*.md
          retention-days: 30
          if-no-files-found: error
      - name: Commit new isolated data and report only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pitchapi/daily reports/pitchapi
          if git diff --cached --quiet; then
            echo "No PitchAPI report changes."
            exit 0
          fi
          git commit -m "data: isolated PitchAPI historical xG snapshot and audit"
          git pull --rebase origin main
          git push origin HEAD:main
