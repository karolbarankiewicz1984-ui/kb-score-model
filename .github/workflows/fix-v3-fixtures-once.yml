name: Fix API v3 fixtures endpoint once
on:
  push:
    paths:
      - '.github/workflows/fix-v3-fixtures-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fixtures calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/api_market_v3_enrich.py')
          s=p.read_text(encoding='utf-8')
          old1='payload, _ = v2.api_get_all_pages("fixtures", team=tid, last=20, timezone="Europe/Warsaw")'
          new1='payload, _ = v2.api_get("fixtures", team=tid, last=20, timezone="Europe/Warsaw")'
          old2='fixtures_payload, headers = v2.api_get_all_pages("fixtures", date=TARGET, timezone="Europe/Warsaw")'
          new2='fixtures_payload, headers = v2.api_get("fixtures", date=TARGET, timezone="Europe/Warsaw")'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected fixtures calls not found')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/fix-v3-fixtures-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api_market_v3_enrich.py .github/workflows/fix-v3-fixtures-once.yml
          git commit -m "fix: use fixtures endpoint without paging in API Market v3"
          git pull --rebase origin main
          git push origin main
