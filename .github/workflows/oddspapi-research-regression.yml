name: OddsPapi all-markets adapter offline regression
on:
  push:
    branches: [codex/oddspapi-odds-layer]
    paths:
      - 'github_models/oddspapi_market.py'
      - 'tests/test_github_models_oddspapi_market.py'
      - '.github/workflows/oddspapi-research-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile adapter and run no-network tests
        run: |
          python -m py_compile github_models/oddspapi_market.py tests/test_github_models_oddspapi_market.py
          python -m unittest discover -s tests -p 'test_github_models_oddspapi_market.py' -v
