name: OddsPapi all-markets adapter offline regression
on:
  push:
    branches: [codex/oddspapi-odds-layer]
    paths:
      - 'github_models/oddspapi_market.py'
      - 'github_models/oddspapi_integration.py'
      - 'github_models/oddspapi_collect.py'
      - 'github_models/oddspapi_produce.py'
      - 'github_models/oddspapi_report_pdf.py'
      - 'tests/test_github_models_oddspapi_market.py'
      - 'tests/test_github_models_oddspapi_integration.py'
      - 'tests/test_github_models_oddspapi_collection.py'
      - 'tests/test_github_models_oddspapi_pdf.py'
      - '.github/workflows/oddspapi-research-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only PDF renderer and fonts for offline test
        run: |
          python -m pip install reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
      - name: Compile adapter and run no-network tests
        run: |
          python -m compileall -q github_models/oddspapi_market.py github_models/oddspapi_integration.py github_models/oddspapi_collect.py github_models/oddspapi_produce.py github_models/oddspapi_report_pdf.py
          python -m unittest discover -s tests -p 'test_github_models_oddspapi*.py' -v
