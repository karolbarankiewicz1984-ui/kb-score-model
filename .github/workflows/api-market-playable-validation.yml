name: API playable shadow validation
on:
  push:
    branches:
      - experiment/api-market-2-playable-odds
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -B -m unittest discover -s tests -p 'test_api_market_playable_shadow.py' -v
      - name: Shadow run on archived days
        run: |
          python tools/api_market_playable_shadow.py 2026-10-06
          python tools/api_market_playable_shadow.py 2026-10-08
          cat reports/api_market_scan/v2/API_MARKET_SCAN_PLAYABLE_2026-10-06.json
          cat reports/api_market_scan/v2/API_MARKET_SCAN_PLAYABLE_2026-10-08.json
      - name: Upload experimental outputs
        uses: actions/upload-artifact@v4
        with:
          name: api-playable-shadow-reports
          path: reports/api_market_scan/v2/

  tomorrow-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify API access
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Build isolated 2026-10-09 market snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python tools/api_national_today_prefetch.py 2026-10-09
          python tools/api_market_scan.py 2026-10-09
          python tools/api_market_v3_enrich.py 2026-10-09
          python tools/api_market_report_diversify.py 2026-10-09
          python tools/api_market_playable_shadow.py 2026-10-09
      - name: Upload preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-market-2026-10-09-preview
          path: |
            reports/api_market_scan/v2/*2026-10-09*
            reports/api_market_scan/2026-10-09.md
            data/api_football/market_work/2026-10-09.json
            data/api_football/market_scan/2026-10-09.json
          if-no-files-found: warn
