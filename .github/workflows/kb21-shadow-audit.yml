name: KB21 shadow prospective outcome audit
on:
  # Audit YESTERDAY Warsaw after the day has ended; no historical N writes.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/kb21_shadow_audit.py'
      - 'tests/test_kb21_shadow_audit.py'
      - '.github/workflows/kb21-shadow-audit.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: kb21-shadow-outcome-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify forward-only settlement tests
        run: python -m unittest tests.test_kb21_shadow_audit -v
      - name: Retrieve genuine GitHub pregame artifacts for yesterday only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(timezone.utc).astimezone(
              ZoneInfo('Europe/Warsaw')).date()
          target = today - timedelta(days=1)
          previous = target - timedelta(days=1)
          output = Path('reports/kb21_shadow_audit/input_runs')
          output.mkdir(parents=True, exist_ok=True)
          command = ['gh', 'run', 'list', '--repo', '${{ github.repository }}',
                     '--workflow', 'kb21-single-source-two-days.yml',
                     '--branch', 'main', '--limit', '90', '--json',
                     'databaseId,createdAt,conclusion,headBranch']
          rows = json.loads(subprocess.check_output(command, text=True))
          chosen = []
          for item in rows:
              if item.get('conclusion') != 'success' or item.get('headBranch') != 'main':
                  continue
              stamp = datetime.fromisoformat(item['createdAt'].replace('Z', '+00:00'))
              local_day = stamp.astimezone(ZoneInfo('Europe/Warsaw')).date()
              if local_day in (previous, target):
                  chosen.append(item['databaseId'])
          for ident in sorted(set(chosen)):
              dest = output / str(ident)
              dest.mkdir(parents=True, exist_ok=True)
              subprocess.run(['gh', 'run', 'download', str(ident),
                              '--repo', '${{ github.repository }}',
                              '--name', 'kb21-api-football-two-days',
                              '--dir', str(dest)], check=True)
          (output / '_retrieval_manifest.json').write_text(json.dumps(
              {'target_warsaw': target.isoformat(),
               'source_workflow': 'kb21-single-source-two-days.yml',
               'downloaded_successful_main_run_ids': sorted(set(chosen)),
               'archive_run_count': len(set(chosen))}, indent=2) + '\n')
          print('Downloaded', len(set(chosen)), 'successful pregame run archives')
          PY
      - name: Audit genuine pregame forecasts against yesterday FT results
        if: github.ref == 'refs/heads/main'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "$API_FOOTBALL_KEY" || {
            echo "::error::API_FOOTBALL_KEY unavailable; never invent final results"
            exit 1
          }
          python -m tools.kb21_shadow_audit \
            --archives reports/kb21_shadow_audit/input_runs \
            --output-dir reports/kb21_shadow_audit/output
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('reports/kb21_shadow_audit/output')
          reports = list(folder.glob('KB21_SHADOW_AUDIT_*.json'))
          assert len(reports) == 1
          doc = json.loads(reports[0].read_text())
          assert doc['register_writes'] is False and doc['old_kb21_n_effect'] == 0
          assert doc['safe_to_publish_play'] is False
          assert doc['unique_pregame_predictions'] >= doc['distinct_settled_matches']
          assert (folder / ('KB21_SHADOW_AUDIT_'+doc['date']+'.md')).is_file()
          print('Verified no historical N writes, no late retrospective predictions and no PLAY')
          PY
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && always()
        with:
          name: kb21-shadow-outcome-audit
          path: reports/kb21_shadow_audit/output/
          retention-days: 30
          if-no-files-found: warn
