name: Export corrected API PDF once
on:
  push:
    paths:
      - '.github/workflows/export-corrected-api-pdf-once.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload corrected PDF
        uses: actions/upload-artifact@v4
        with:
          name: API_MARKET_SCAN_2026-10-05_CORRECTED
          path: reports/api_market_scan/API_MARKET_SCAN_2026-10-05.pdf
          if-no-files-found: error
      - name: Self-remove
        shell: bash
        run: |
          rm .github/workflows/export-corrected-api-pdf-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/export-corrected-api-pdf-once.yml
          git commit -m "chore: remove corrected PDF export workflow"
          git pull --rebase origin main
          git push origin main
