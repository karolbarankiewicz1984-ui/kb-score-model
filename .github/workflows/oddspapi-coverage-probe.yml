name: OddsPapi one-shot three-league market coverage
on:
  push:
    branches: [codex/oddspapi-odds-layer]
    paths:
      - 'github_models/oddspapi_coverage_probe.py'
      - '.github/workflows/oddspapi-coverage-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare real quoted markets from up to three games, max five billable requests
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python -B -m github_models.oddspapi_coverage_probe
