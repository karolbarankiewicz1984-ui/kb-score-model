name: KB21 recovery engine tests
on:
  push:
    paths:
      - 'tools/kb21_engine.py'
      - 'tools/kb21_api_prematch.py'
      - 'tools/kb21_single_source_calendar.py'
      - 'tests/test_kb21_single_source_calendar.py'
      - 'tools/kb21_single_source_form.py'
      - 'tools/kb21_form_evidence.py'
      - 'tests/test_kb21_form_evidence.py'
      - 'tools/kb21_single_source_worklist.py'
      - 'tools/kb21_shadow_audit.py'
      - 'tools/kb21_shadow_archive.py'
      - 'tests/test_kb21_shadow_archive.py'
      - 'tests/test_kb21_shadow_audit.py'
      - '.github/workflows/kb21-shadow-audit.yml'
      - 'tests/test_kb21_single_source_worklist.py'
      - 'tests/test_kb21_single_source_form.py'
      - 'tests/test_kb21_budgeted_history.py'
      - '.github/workflows/kb21-single-source-two-days.yml'
      - 'tools/kb21_api_diagnostic.py'
      - 'tools/kb21_gate_audit.py'
      - 'tools/kb21_independent_calendar.py'
      - 'tools/kb21_football_data_org.py'
      - 'tools/kb21_readiness_summary.py'
      - 'tests/test_kb21_readiness_summary.py'
      - '.github/workflows/kb21-api-prematch.yml'
      - '.github/workflows/kb21-independent-calendar.yml'
      - 'tests/test_kb21_engine.py'
      - 'tests/test_kb21_api_diagnostic.py'
      - 'tests/test_kb21_gate_audit.py'
      - 'tests/test_kb21_independent_calendar.py'
      - 'tests/test_kb21_football_data_org.py'
      - '.github/workflows/kb21-recovery-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF renderer for complete regression suite
        run: python -m pip install 'reportlab>=4,<5'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_kb21*.py' -v
