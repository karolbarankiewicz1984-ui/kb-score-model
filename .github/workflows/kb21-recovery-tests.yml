name: KB21 recovery engine tests
on:
  push:
    paths:
      - 'tools/kb21_engine.py'
      - 'tools/kb21_api_prematch.py'
      - 'tools/kb21_api_diagnostic.py'
      - 'tools/kb21_gate_audit.py'
      - 'tools/kb21_independent_calendar.py'
      - 'tests/test_kb21_engine.py'
      - 'tests/test_kb21_api_diagnostic.py'
      - 'tests/test_kb21_gate_audit.py'
      - 'tests/test_kb21_independent_calendar.py'
      - '.github/workflows/kb21-recovery-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_kb21*.py' -v
