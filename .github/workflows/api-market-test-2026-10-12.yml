name: API Market test 2026-10-12
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-market-test-2026-10-12.yml"
      - "tools/api_market_presentation.py"
      - "tools/render_api_market_pdf.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-next-day:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tools"
    steps:
      - uses: actions/checkout@v4
      - name: Check API credential
        run: test -n "$API_FOOTBALL_KEY"
      - name: Install PDF dependency before PDF unit tests
        run: python -m pip install --disable-pip-version-check "reportlab>=4,<5"
      - name: Regression tests
        run: python -B -m unittest discover -s tests -p "test_api_market*.py"
      - name: Prefetch national teams for 2026-10-12
        run: python tools/api_national_today_prefetch.py 2026-10-12
      - name: Test raw market scan for 2026-10-12
        run: python tools/api_market_scan.py 2026-10-12
      - name: Build v3 enrichment for 2026-10-12
        run: python tools/api_market_v3_enrich.py 2026-10-12
      - name: Rank test positions for 2026-10-12
        run: python tools/api_market_report_diversify.py 2026-10-12
      - name: Check renderer imports in direct execution mode
        run: |
          python -c 'from tools.pitchapi_prematch_context import lookup_context; from tools.pitchapi_market_validation import review_position'
          python tools/render_api_market_pdf.py --help > /dev/null
      - name: Render test PDF for 2026-10-12
        run: python tools/render_api_market_pdf.py 2026-10-12 --source data/api_football/market_scan/2026-10-12.json --output /tmp/API_MARKET_TEST_2026-10-12.pdf
      - name: Upload diagnostic outputs without modifying production data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-market-2026-10-12-test
          path: |
            data/api_football/market_work/2026-10-12.json
            data/api_football/market_scan/2026-10-12.json
            reports/api_market_scan/2026-10-12.md
            /tmp/API_MARKET_TEST_2026-10-12.pdf
          if-no-files-found: ignore
