name: Patch API PDF legend once

on:
  push:
    paths:
      - ".github/workflows/patch-api-pdf-legend-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch renderer and spec
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/render_api_market_pdf.py')
          text = path.read_text(encoding='utf-8')
          old = '''    story.extend([\n        Spacer(1, 1 * mm),\n        Paragraph(\n            "Pełne L5/L10/L15, odmarżowione prawdopodobieństwa, liczba bukmacherów, snapshoty rynku i surowe notowania są archiwizowane w JSON-ie na GitHubie.",\n            subtitle,\n        ),\n    ])\n'''
          new = '''    story.extend([\n        Spacer(1, 1 * mm),\n        Paragraph(\n            "Pełne L5/L10/L15, odmarżowione prawdopodobieństwa, liczba bukmacherów, snapshoty rynku i surowe notowania są archiwizowane w JSON-ie na GitHubie.",\n            subtitle,\n        ),\n        Spacer(1, 1.5 * mm),\n        Paragraph("Jak czytać ten raport - w skrócie", heading),\n        Paragraph(\n            "<b>API PURE</b> - co wynika wyłącznie z naszej historii i statystyk API, bez kursów. "\n            "<b>Po analizie rynku</b> - ta sama pozycja po sprawdzeniu aktualnych notowań bukmacherów. "\n            "<b>↑ / ↓ / →</b> - rynek odpowiednio podnosi, obniża albo praktycznie nie zmienia oceny. "\n            "<b>Sygnał rynku</b> - krótka ocena, czy rynek potwierdza statystykę, jest neutralny czy ostrzega. "\n            "<b>Komentarz</b> - prostym językiem wyjaśnia, dlaczego ocena się zmieniła lub pozostała bez zmian. "\n            "Ten raport jest osobny od KB Score 2.1 CORE i nie zmienia jego ustawień ani N.",\n            comment_style,\n        ),\n    ])\n'''
          if 'Jak czytać ten raport - w skrócie' not in text:
              if old not in text:
                  raise SystemExit('Expected PDF story block not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          spec = Path('API_MARKET_SCAN_V2.md')
          s = spec.read_text(encoding='utf-8')
          marker = '\n## 11. Zasada dalszego rozwoju\n'
          addition = '''\n## 11. Obowiązkowa legenda na końcu PDF\n\nKażdy codzienny PDF API Market Scan kończy się krótką sekcją „Jak czytać ten raport - w skrócie”, napisaną prostym językiem. Wyjaśnia ona: API PURE, ocenę po analizie rynku, znaczenie strzałek, sygnał rynku i komentarz oraz przypomina, że raport jest osobny od KB Score 2.1 CORE.\n\n'''
          if '## 11. Obowiązkowa legenda na końcu PDF' not in s:
              if marker not in s:
                  raise SystemExit('Expected spec marker not found')
              s = s.replace(marker, addition + '## 12. Zasada dalszego rozwoju\n', 1)
              spec.write_text(s, encoding='utf-8')
          PY

      - name: Re-render current API PDF
        run: |
          python -m pip install --disable-pip-version-check 'reportlab>=4,<5'
          python tools/render_api_market_pdf.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-api-pdf-legend-once.yml
          git add tools/render_api_market_pdf.py API_MARKET_SCAN_V2.md reports/api_market_scan
          git commit -m "feat: add plain-language legend to API Market Scan PDF"
          git pull --rebase origin main
          git push origin main
