name: API-Football Conference League patch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/api-football-conference-patch-5m.yml"
      - "tools/api_football_conference_patch_5m.py"

permissions:
  contents: write

concurrency:
  group: api-football-conference-patch-5m
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Patch Conference League data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python tools/api_football_conference_patch_5m.py "2026-05-04" "2026-10-03"
      - name: Commit patched international dataset
        run: |
          if git diff --quiet -- data/api_football/international_5m && [ -z "$(git status --porcelain -- data/api_football/international_5m)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/international_5m
          git commit -m "data: add Conference League to international backfill"
          git pull --rebase origin main
          git push origin main
