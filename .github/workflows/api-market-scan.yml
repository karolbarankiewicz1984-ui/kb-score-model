# API Market Scan v3: PURE + reliability + market + context + compact daily PDF
# Final national-team coverage is populated before the raw sieve.
name: API Market Scan

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD; blank = today"
        required: false
        type: string
  schedule:
    # Early market snapshots, then a final run near 10:30 Europe/Warsaw.
    - cron: '5 4 * * *'
    - cron: '5 7 * * *'
    - cron: '30 8 * * *'
    - cron: '30 9 * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-market-scan.yml"
      - "tools/api_market*.py"
      - "config/api_market.json"
      - "tests/test_api_market*.py"
      - "tools/api_market_v3_enrich.py"
      - "tools/api_national_today_prefetch.py"
      - "tools/api_market_report_diversify.py"
      - "tools/render_api_market_pdf.py"

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Make both `tools.*` package imports and direct sibling imports resolvable.
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tools"

permissions:
  contents: write

concurrency:
  group: api-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scheduled slot
        id: slot
        shell: bash
        run: |
          RUN_SCAN=yes
          RENDER_PDF=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(TZ=Europe/Warsaw date +%z)
            SLOT="${{ github.event.schedule }}"
            RENDER_PDF=no
            case "$SLOT" in
              '30 8 * * *')
                if [ "$OFFSET" = "+0200" ]; then RENDER_PDF=yes; else RUN_SCAN=no; fi ;;
              '30 9 * * *')
                if [ "$OFFSET" = "+0100" ]; then RENDER_PDF=yes; else RUN_SCAN=no; fi ;;
            esac
          fi
          echo "run_scan=$RUN_SCAN" >> "$GITHUB_OUTPUT"
          echo "render_pdf=$RENDER_PDF" >> "$GITHUB_OUTPUT"

      - name: Test API calculations, publication and isolation
        run: python -B -m unittest discover -s tests -p "test_api_market*.py"

      - name: Verify API secret
        if: steps.slot.outputs.run_scan == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"

      - name: Prefetch full national-team last-20 history
        if: steps.slot.outputs.render_pdf == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_national_today_prefetch.py "${{ inputs.date }}"
          else
            python tools/api_national_today_prefetch.py
          fi

      - name: Build raw API Market freeze and market snapshot
        if: steps.slot.outputs.run_scan == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_scan.py "${{ inputs.date }}"
          else
            python tools/api_market_scan.py
          fi

      - name: Build API Market Scan v3 background layers
        if: steps.slot.outputs.render_pdf == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_v3_enrich.py "${{ inputs.date }}"
          else
            python tools/api_market_v3_enrich.py
          fi

      - name: Freeze and publish unlimited API ranking
        if: steps.slot.outputs.render_pdf == 'yes'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_report_diversify.py "${{ inputs.date }}"
          else
            python tools/api_market_report_diversify.py
          fi

      - name: Install PDF renderer
        if: steps.slot.outputs.render_pdf == 'yes'
        run: python -m pip install --disable-pip-version-check 'reportlab>=4,<5'

      - name: Check renderer and PitchAPI imports before PDF creation
        if: steps.slot.outputs.render_pdf == 'yes'
        run: |
          python -c 'from tools.pitchapi_prematch_context import lookup_context; from tools.pitchapi_market_validation import review_position; print("PitchAPI imports OK")'
          python tools/render_api_market_pdf.py --help > /dev/null

      - name: Generate compact daily PDF
        if: steps.slot.outputs.render_pdf == 'yes'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/render_api_market_pdf.py "${{ inputs.date }}"
          else
            python tools/render_api_market_pdf.py
          fi

      - name: Commit scan output, data cache and PDF
        if: steps.slot.outputs.run_scan == 'yes'
        shell: bash
        run: |
          python tools/api_market_integrity.py
          TRACKED="data/api_football/predictions data/api_football/market_scan data/api_football/market_snapshots data/api_football/national_dynamic data/api_football/international_5m/national reports/api_market_scan"
          if git diff --quiet -- $TRACKED && [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "No scan changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "report: API Market Scan v3"
          # Concurrent report writers can modify the same date snapshot. Preserve the
          # latest generated scan while retrying the push on top of current main.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Scan published on attempt $attempt."
              exit 0
            fi
            echo "Push race (attempt $attempt); replaying our report commit on latest main."
            git fetch origin main
            # Keep the new report commit, preferring our freshly generated scan files
            # when another workflow published a snapshot for the same date.
            GIT_SEQUENCE_EDITOR=: git -c merge.renormalize=true rebase -X ours origin/main || {
              echo "Automatic report rebase failed; aborting to avoid corrupting data."
              git rebase --abort || true
              exit 1
            }
          done
          echo "Could not publish after five attempts."
          exit 1
