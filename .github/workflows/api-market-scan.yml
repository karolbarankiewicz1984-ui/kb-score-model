# API Market Scan v3: PURE + reliability + market + context + compact daily PDF
# Final national-team coverage is populated before the raw sieve.
name: API Market Scan

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD; blank = today"
        required: false
        type: string
  schedule:
    # Early market snapshots, then a final run near 10:30 Europe/Warsaw.
    - cron: '5 4 * * *'
    - cron: '5 7 * * *'
    - cron: '30 8 * * *'
    - cron: '30 9 * * *'
  push:
    paths:
      - ".github/workflows/api-market-scan.yml"
      - "tools/api_market_scan.py"
      - "tools/api_market_v3_enrich.py"
      - "tools/api_national_today_prefetch.py"
      - "tools/api_market_report_diversify.py"
      - "tools/render_api_market_pdf.py"

permissions:
  contents: write

concurrency:
  group: api-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scheduled slot
        id: slot
        shell: bash
        run: |
          RUN_SCAN=yes
          RENDER_PDF=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_HOUR=$(date -u +%H)
            LOCAL_HOUR=$(TZ=Europe/Warsaw date +%H)
            # Early runs collect only market movement. The final local 10:30 run
            # refreshes full national-team history, enriches v3 and generates PDF.
            if [ "$LOCAL_HOUR" != "10" ]; then
              RENDER_PDF=no
            fi
            # Of the 08:30/09:30 UTC pair, keep only the one landing at 10:30 Poland time.
            if { [ "$UTC_HOUR" = "08" ] || [ "$UTC_HOUR" = "09" ]; } && [ "$LOCAL_HOUR" != "10" ]; then
              RUN_SCAN=no
              RENDER_PDF=no
            fi
          fi
          echo "run_scan=$RUN_SCAN" >> "$GITHUB_OUTPUT"
          echo "render_pdf=$RENDER_PDF" >> "$GITHUB_OUTPUT"

      - name: Verify API secret
        if: steps.slot.outputs.run_scan == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"

      - name: Prefetch full national-team last-20 history
        if: steps.slot.outputs.render_pdf == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_national_today_prefetch.py "${{ inputs.date }}"
          else
            python tools/api_national_today_prefetch.py
          fi

      - name: Build raw API Market freeze and market snapshot
        if: steps.slot.outputs.run_scan == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_scan.py "${{ inputs.date }}"
          else
            python tools/api_market_scan.py
          fi

      - name: Build API Market Scan v3 background layers
        if: steps.slot.outputs.render_pdf == 'yes'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_v3_enrich.py "${{ inputs.date }}"
          else
            python tools/api_market_v3_enrich.py
          fi

      - name: Diversify user-facing positions
        if: steps.slot.outputs.render_pdf == 'yes'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_report_diversify.py "${{ inputs.date }}"
          else
            python tools/api_market_report_diversify.py
          fi

      - name: Install PDF renderer
        if: steps.slot.outputs.render_pdf == 'yes'
        run: python -m pip install --disable-pip-version-check 'reportlab>=4,<5'

      - name: Generate compact daily PDF
        if: steps.slot.outputs.render_pdf == 'yes'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/render_api_market_pdf.py "${{ inputs.date }}"
          else
            python tools/render_api_market_pdf.py
          fi

      - name: Commit scan output, data cache and PDF
        if: steps.slot.outputs.run_scan == 'yes'
        shell: bash
        run: |
          TRACKED="data/api_football/market_scan data/api_football/market_snapshots data/api_football/national_dynamic data/api_football/international_5m/national reports/api_market_scan"
          if git diff --quiet -- $TRACKED && [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "No scan changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "report: API Market Scan v3"
          git pull --rebase origin main
          git push origin main
