name: API Market Scan

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD; blank = today"
        required: false
        type: string
  schedule:
    # 09:05 UTC = 11:05 CEST / 10:05 CET. Kept ahead of the 11:30 KB Score routine.
    - cron: '5 9 * * *'
  push:
    paths:
      - ".github/workflows/api-market-scan.yml"
      - "tools/api_market_scan.py"

permissions:
  contents: write

concurrency:
  group: api-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"

      - name: Build API Market Scan
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_scan.py "${{ inputs.date }}"
          else
            python tools/api_market_scan.py
          fi

      - name: Commit scan output
        shell: bash
        run: |
          if git diff --quiet -- data/api_football/market_scan reports/api_market_scan && [ -z "$(git status --porcelain -- data/api_football/market_scan reports/api_market_scan)" ]; then
            echo "No scan changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_football/market_scan reports/api_market_scan
          git commit -m "report: API Market Scan"
          git pull --rebase origin main
          git push origin main
