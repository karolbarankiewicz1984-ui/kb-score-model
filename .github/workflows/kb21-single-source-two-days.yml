name: KB21 SINGLE SOURCE API-Football today+tomorrow
on:
  # ONE active daily KB21 calendar. Runs at 08:00 UTC (09:00/10:00 Warsaw).
  # GitHub may start late; actual capture UTC is recorded, and past games
  # are excluded. Existing API Market's separate scoring is not modified.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/kb21_single_source_calendar.py'
      - 'tests/test_kb21_single_source_calendar.py'
      - 'tools/kb21_single_source_form.py'
      - 'tools/kb21_form_evidence.py'
      - 'tools/kb21_standings_context.py'
      - 'tools/kb21_pitchapi_prematch_bridge.py'
      - 'tools/kb21_xg_pair_shadow.py'
      - 'tools/kb21_pdf_reports.py'
      - 'tests/test_kb21_pdf_reports.py'
      - 'tests/test_kb21_xg_pair_shadow.py'
      - 'tests/test_kb21_pitchapi_prematch_bridge.py'
      - 'tests/test_kb21_standings_context.py'
      - 'tests/test_kb21_form_evidence.py'
      - 'tools/kb21_single_source_worklist.py'
      - 'tests/test_kb21_single_source_worklist.py'
      - 'tests/test_kb21_single_source_form.py'
      - 'tests/test_kb21_budgeted_history.py'
      - '.github/workflows/kb21-single-source-two-days.yml'
permissions:
  contents: read
concurrency:
  group: kb21-single-source-two-days
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compact PDF dependency
        run: python -m pip install 'reportlab>=4,<5'
      - name: Verify two-day provider validation offline
        run: python -m unittest tests.test_kb21_single_source_calendar tests.test_kb21_single_source_form tests.test_kb21_budgeted_history tests.test_kb21_form_evidence tests.test_kb21_api_diagnostic -v
      - name: Fetch EXACTLY today and tomorrow in Europe/Warsaw
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "$API_FOOTBALL_KEY" || {
            echo "::error::Missing API_FOOTBALL_KEY; provider calendar cannot be verified"
            exit 1
          }
          python -m tools.kb21_single_source_calendar \
            --output-dir reports/kb21_single_source
      - name: Audit read-only research inputs from ONLY that calendar
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from tools.kb21_single_source_calendar import SCHEMA, DAY_SCHEMA
          root = Path('reports/kb21_single_source')
          m = json.loads((root / 'SINGLE_SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['schema'] == SCHEMA and len(m['dates']) == 2
          assert m['single_source_gate'] == 'PASS_SOURCE'
          assert m['provider_count'] == 1
          assert m['safe_to_publish_play'] is False
          for day in m['dates']:
              snapshot = json.loads((root / ('KB21_API_CALENDAR_'+day+'.json')).read_text(encoding='utf-8'))
              inputs = json.loads((root / ('KB21_INPUT_'+day+'.json')).read_text(encoding='utf-8'))
              assert snapshot['schema'] == DAY_SCHEMA and snapshot['date'] == day
              assert snapshot['single_source_gate'] == 'PASS_SOURCE'
              assert inputs['single_source_gate'] == 'PASS_SOURCE'
              assert inputs['pre_match_fixtures'] == len(inputs['candidates'])
              assert inputs['register_writes'] is False
              assert all(row['p_model'] is None and row['kb21_sport_score'] is None
                         for row in inputs['candidates'])
              subprocess.run([
                  'python', '-m', 'tools.kb21_api_diagnostic',
                  str(root / ('KB21_INPUT_'+day+'.json')),
                  '--output', str(root / ('KB21_RESEARCH_'+day+'.json'))], check=True)
          print('PASS: TWO Warsaw dates, sole API-Football source, KB21 inputs '
                'valid, no second calendar and NO PLAY')
          PY
      - name: Gather real team histories for up to 30 games/day (80 calls max)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -m tools.kb21_single_source_form \
            --calendar-dir reports/kb21_single_source \
            --output-dir reports/kb21_single_source \
            --max-per-day 30 \
            --max-history-calls 80 \
            --reserve-daily-requests 25
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/kb21_single_source')
          doc = json.loads((root / 'KB21_FORM_MANIFEST.json').read_text(encoding='utf-8'))
          assert len(doc['dates']) == 2
          assert doc['scoring_fields_filled_automatically'] == 0
          assert doc['safe_to_publish_play'] is False
          assert 0 <= doc['api_team_history_calls'] <= 80
          assert doc['api_history_query_budget'] == 80
          assert doc['api_daily_quota_reserve'] == 25
          assert doc['historical_form_sampled'] <= 60
          assert doc['team_history_queries_skipped'] >= 0
          assert doc['shadow_goal_forecasts_prepared'] <= doc['fixtures_with_two_valid_goal_histories']
          assert doc['fixtures_with_two_preprice_sport_evidence_packs'] <= doc['historical_form_sampled']
          assert doc['automatic_sport_evidence_not_ratings'] is True
          for day in doc['dates']:
              form = json.loads((root / ('KB21_FORM_' + day + '.json')).read_text(encoding='utf-8'))
              pdf = root / ('KB21_FORM_' + day + '.pdf')
              assert pdf.stat().st_size > 1500 and pdf.read_bytes().startswith(b'%PDF-')
              assert len(form['matches']) <= 30
              shadow = json.loads((root / ('KB21_SHADOW_' + day + '.json'))
                                  .read_text(encoding='utf-8'))
              assert shadow['schema'] == 'kb21-api-shadow-forecast-snapshot-v1'
              assert shadow['provider'] == 'API-Football'
              assert shadow['register_writes'] is False
              assert shadow['kb21_n_effect'] == 0
              assert len(shadow['predictions']) == len(form['matches'])
              for prediction in shadow['predictions']:
                  assert prediction['original_kb21_p_model'] is None
                  assert prediction['selection'] is None
                  assert prediction['odds'] is None
                  assert prediction['match_result'] is None
                  assert prediction['safe_to_publish_play'] is False
                  if prediction['probabilities_1x2_over25']:
                      p = prediction['probabilities_1x2_over25']
                      assert abs(p['home']+p['draw']+p['away']-1) < .0002
              for match in form['matches']:
                  assert all(match['history'][side].get('sport_evidence') is None or
                             (match['history'][side]['sport_evidence']['original_p_model'] is None and
                              match['history'][side]['sport_evidence']['safe_to_publish_play'] is False)
                             for side in ('home','away'))
                  assert match['analyst_assessment']['P_model_pre_odds'] is None
                  assert match['analyst_assessment']['sport_score_0_100'] is None
                  assert match['safe_to_publish_play'] is False
          print('Verified factual goal history and strictly separate pregame '
                'shadow 1X2/over forecasts for <=30 games/day; original '
                'KB21 STR/QUAL/MATCH/P(model) remain unset; no PLAY')
          PY
      - name: Build ALL-fixtures analyst worksheets, never auto-PLAY
        run: |
          python -m unittest tests.test_kb21_single_source_worklist -v
          python -m tools.kb21_single_source_worklist \
            --calendar-dir reports/kb21_single_source \
            --output-dir reports/kb21_single_source
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/kb21_single_source')
          m = json.loads((root / 'SINGLE_SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          x = json.loads((root / 'KB21_ANALYST_WORKLIST_MANIFEST.json').read_text(encoding='utf-8'))
          assert x['dates'] == m['dates']
          assert x['total_candidates'] == m['total_research_candidates']
          assert x['automatic_p_model_count'] == x['automatic_play_count'] == 0
          assert x['register_writes'] is False and x['kb21_n_effect'] == 0
          for day in x['dates']:
              form = json.loads((root / ('KB21_ANALYST_WORKLIST_'+day+'.json')).read_text(encoding='utf-8'))
              assert len(form['records']) == form['calendar_candidates']
              assert (root / ('KB21_ANALYST_WORKLIST_'+day+'.md')).is_file()
              assert all(row['original_kb21_p_model'] is None and
                         row['assessment_template']['freeze_at'] is None and
                         row['safe_to_publish_play'] is False
                         for row in form['records'])
          print('PASS: every single-source candidate is visible for analyst review, NO PLAY')
          PY
      - name: Add bounded current-season league and opponent-strength context
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -m unittest tests.test_kb21_standings_context -v
          python -m tools.kb21_standings_context \
            --calendar-dir reports/kb21_single_source \
            --output-dir reports/kb21_single_source \
            --max-calls 16 \
            --reserve-daily 25
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/kb21_single_source")
          manifest=json.loads((p/"SINGLE_SOURCE_MANIFEST.json").read_text())
          tables=json.loads((p/"KB21_STANDINGS_CONTEXT_MANIFEST.json").read_text())
          assert tables["dates"]==manifest["dates"]
          assert tables["candidate_matches"]==manifest["total_research_candidates"]
          assert tables["standings_calls"]<=16
          assert tables["automatic_str_qual_match_count"]==0
          assert tables["automatic_p_model_count"]==0
          assert tables["safe_to_publish_play"] is False
          assert tables["register_writes"] is False and tables["kb21_n_effect"]==0
          for day in manifest["dates"]:
              d=json.loads((p/("KB21_STANDINGS_CONTEXT_"+day+".json")).read_text())
              calendar=json.loads((p/("KB21_API_CALENDAR_"+day+".json")).read_text())
              assert {x["fixture_id"] for x in d["matches"]} == {
                  x["fixture_id"] for x in calendar["candidates"]}
              assert all(x["original_p_model"] is None and
                         x["str_35"] is None and x["qual_35"] is None and
                         x["match_30"] is None and
                         x["safe_to_publish_play"] is False
                         for x in d["matches"])
          print("PASS: same provider, all candidates retained; standings only; no invented Elo, xG or PLAY")
          PY
      - name: Join ONLY archived genuine pre-match PitchAPI xG to canonical fixtures (no API)
        run: |
          python -m unittest tests.test_kb21_pitchapi_prematch_bridge -v
          python -m tools.kb21_pitchapi_prematch_bridge \
            --calendar-dir reports/kb21_single_source \
            --pitch-dir data/pitchapi/prematch \
            --output-dir reports/kb21_single_source
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("reports/kb21_single_source")
          manifest=json.loads((folder/"SINGLE_SOURCE_MANIFEST.json").read_text())
          x=json.loads((folder/"KB21_PREODDS_XG_MANIFEST.json").read_text())
          assert x["dates"]==manifest["dates"]
          assert x["calendar_candidates"]==manifest["total_research_candidates"]
          assert x["external_api_calls"]==0
          assert x["automatic_p_model_count"]==0
          assert x["automatic_str_qual_match_count"]==0
          assert x["register_writes"] is False
          assert x["original_kb21_n_effect"]==0
          assert x["safe_to_publish_play"] is False
          for day in x["dates"]:
              rows=json.loads((folder/("KB21_PREODDS_XG_"+day+".json")).read_text())
              cal=json.loads((folder/("KB21_API_CALENDAR_"+day+".json")).read_text())
              assert {m["fixture_id"] for m in rows["records"]}=={
                  m["fixture_id"] for m in cal["candidates"]}
              assert all(r["original_kb21_p_model"] is None and
                         r["str_35"] is None and r["qual_35"] is None and
                         r["match_30"] is None and r["odds"] is None and
                         r["safe_to_publish_play"] is False
                         for r in rows["records"])
          print("PASS: read-only captured historical PitchAPI xG, no new fixtures/P(model)/PLAY")
          PY
      - name: Freeze xG model vs original goals-shadow on identical pre-kickoff fixtures
        run: |
          python -m unittest tests.test_kb21_xg_pair_shadow -v
          python -m tools.kb21_xg_pair_shadow \
            --source-dir reports/kb21_single_source \
            --output-dir reports/kb21_single_source
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/kb21_single_source")
          m=json.loads((p/"SINGLE_SOURCE_MANIFEST.json").read_text())
          xgm=json.loads((p/"KB21_PREODDS_XG_MANIFEST.json").read_text())
          pairs=0
          for day in m["dates"]:
              a=json.loads((p/("KB21_XG_V_GOALS_SHADOW_"+day+".json")).read_text())
              assert a["schema"]=="kb21-paired-xg-vs-goals-shadow-v1"
              assert a["register_writes"] is False and a["kb21_n_effect"]==0
              assert a["safe_to_publish_play"] is False
              assert a["original_kb21_p_model"] is None
              assert a["calibrated"] is False
              assert a["paired_count"]<=xgm["matches_with_verified_prematch_xg"]
              assert all(
                  x["original_kb21_p_model"] is None
                  and x["selection"] is None and x["odds"] is None
                  and x["match_result"] is None
                  and x["safe_to_publish_play"] is False
                  for x in a["pairs"])
              pairs+=a["paired_count"]
          print("Verified",pairs,"genuine paired PREMATCH frozen xG and goals forecasts, no PLAY")
          PY
      - name: Render small readable Polish PDFs for today's and tomorrow's A/B research
        run: |
          python -m unittest tests.test_kb21_pdf_reports -v
          python -m tools.kb21_pdf_reports forecast \
            --source-dir reports/kb21_single_source \
            --output-dir reports/kb21_single_source
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("reports/kb21_single_source")
          d=json.loads((folder/"SINGLE_SOURCE_MANIFEST.json").read_text())
          for day in d["dates"]:
              file=folder/("KB21_XG_V_GOALS_SHADOW_"+day+".pdf")
              assert file.read_bytes().startswith(b"%PDF-")
              assert file.stat().st_size>1500
          print("PASS: exactly two date-scoped compact forecast PDFs, no changes to predictions or N")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb21-api-football-two-days
          path: reports/kb21_single_source/
          retention-days: 30
          if-no-files-found: error
