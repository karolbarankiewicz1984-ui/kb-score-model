name: MultiModel panel offline regression
on:
  pull_request:
    paths:
      - 'github_models/panel_*.py'
      - 'tests/test_multimodel_panel_*.py'
      - '.github/workflows/multimodel-panel-export-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_multimodel_panel_*.py' -v
