name: PitchAPI xG historical backfill - independent

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start YYYY-MM-DD (required for manual date range)'
        type: string
        required: true
      to_date:
        description: 'End YYYY-MM-DD (inclusive; max 7 days)'
        type: string
        required: true
  push:
    paths:
      - '.github/workflows/pitchapi-xg-backfill.yml'
    # One-time bootstrap reruns when only this workflow file changes.
    # Verified club/competition aliases for Oct 12-13 now included.

permissions:
  contents: write

concurrency:
  group: pitchapi-xg-lab
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PitchAPI lab regression tests
        run: python -m unittest tests.test_pitchapi_xg_lab -v
      - name: Install SDK
        run: python -m pip install --disable-pip-version-check pitchapi==0.1.6
      - name: Backfill dates with bounded sample
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import os, subprocess
          if not os.getenv('PITCHAPI_API_KEY'):
              raise SystemExit('Missing secret PITCHAPI_API_KEY')
          if os.environ['EVENT_NAME'] == 'push':
              start = date(2026, 10, 12)
              end = date(2026, 10, 13)
          else:
              start = date.fromisoformat(os.environ['FROM_DATE'])
              end = date.fromisoformat(os.environ['TO_DATE'])
          if end < start or (end - start).days > 6:
              raise SystemExit('Date range must cover 1 to 7 days, ascending')
          day = start
          while day <= end:
              print('Collecting:', day, flush=True)
              subprocess.run(['python', '-m', 'tools.pitchapi_xg_lab',
                              '--date', day.isoformat(), '--max-matches', '75'], check=True)
              day += timedelta(days=1)
          PY
      - name: Summarize isolated historic comparisons
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          reports = sorted(glob.glob('reports/pitchapi/*.json'))
          output = ['# PitchAPI history backfill', '', '| Date | Pitch fixtures | API-F fixtures | Paired | Usable xG |', '|---|---:|---:|---:|---:|']
          for path in reports:
              p = json.load(open(path, encoding='utf-8'))
              output.append(f"| {p['date']} | {p['pitchapi_fixtures']} | {p['api_football_fixtures']} | {p['matched']} | {p['usable_for_historical_calibration']} |")
          output += ['', '**No KB / DEV N or scoring changes.**']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(output) + '\n')
          print('\n'.join(output))
          PY
      - name: Upload historical reports
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-xg-backfill
          path: |
            data/pitchapi/daily/*.json
            reports/pitchapi/*.json
            reports/pitchapi/*.md
          retention-days: 30
          if-no-files-found: error
      - name: Commit only PitchAPI data and comparison reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pitchapi/daily reports/pitchapi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: isolated PitchAPI xG historical backfill"
          git pull --rebase origin main
          git push origin HEAD:main
