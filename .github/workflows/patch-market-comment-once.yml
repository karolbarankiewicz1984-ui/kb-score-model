name: Patch market comment once

on:
  push:
    paths:
      - ".github/workflows/patch-market-comment-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch wording and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/api_market_scan.py')
          s = p.read_text(encoding='utf-8')
          old = '''    extras = []\n    spread = market.get("bookmaker_spread_pp")\n    if reliability == "strong":\n        extras.append("Notowania wielu bukmacherów są spójne.")\n    elif reliability == "weak" or (spread is not None and spread > 10):\n        extras.append("Między bukmacherami widać większy rozrzut, dlatego korekta jest ograniczona.")\n'''
          new = '''    extras = []\n    spread = market.get("bookmaker_spread_pp")\n    paired = market.get("paired_books", 0)\n    if reliability == "strong":\n        extras.append("Notowania wielu bukmacherów są spójne.")\n    elif paired <= 2:\n        extras.append("Dostępnych jest tylko kilka pełnych notowań, dlatego korekta jest ograniczona.")\n    elif spread is not None and spread > 10:\n        extras.append("Między bukmacherami widać większy rozrzut, dlatego korekta jest ograniczona.")\n    elif reliability == "medium":\n        extras.append("Konsensus rynku jest wystarczająco szeroki do umiarkowanej korekty.")\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/patch-market-comment-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api_market_scan.py .github/workflows/patch-market-comment-once.yml
          git commit -m "fix: describe thin and divergent markets separately"
          git pull --rebase origin main
          git push origin main
