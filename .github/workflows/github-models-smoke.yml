name: GitHub Models isolated end-to-end smoke
on:
  push:
    paths:
      - '.github/workflows/github-models-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * *'

permissions:
  contents: write

jobs:
  independent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated research branch (never main code)
        uses: actions/checkout@v4
        with:
          ref: codex/multimodel-v2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependency
        run: python -m pip install 'git+https://github.com/callumfm/dixon-coles.git'
      - name: Run independent test suite
        run: |
          python -m unittest tests.test_github_models_daily_queue tests.test_github_models_independent_forecasts tests.test_github_models_kb3_history_bridge tests.test_github_models_public_results tests.test_github_models_team_mapping tests.test_github_models_dixon_runner tests.test_github_models_dixon_normalization tests.test_pitchapi_prematch_context -v
      - name: Fetch public observed results
        run: python -m github_models.public_results
      - name: Checkout main snapshot files read-only
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-snapshots
          sparse-checkout: data/pitchapi/prematch
          persist-credentials: false
      - name: Read latest main PitchAPI snapshots without modifying production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pitchapi/prematch
          TODAY="$(TZ=Europe/Warsaw date +%F)"
          for OFFSET in 0 1 2; do
            DAY="$(TZ=Europe/Warsaw date -d "$TODAY + $OFFSET day" +%F)"
            if [ -f "main-snapshots/data/pitchapi/prematch/$DAY.json" ]; then
              cp "main-snapshots/data/pitchapi/prematch/$DAY.json" "data/pitchapi/prematch/$DAY.json"
              echo "Loaded main PitchAPI snapshot: $DAY"
            else
              echo "Missing main PitchAPI snapshot: $DAY"
            fi
          done
      - name: Build fixture queue and coverage
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DAY="$(TZ=Europe/Warsaw date +%F)"
          python -m github_models.daily_queue --as-of "$NOW"
          python -m github_models.coverage_audit --queue "reports/github_models/queues/$DAY.json" --history data/github_models/verified_results.json --output "reports/github_models/coverage/$DAY.json" --as-of "$NOW"
          python -m github_models.predict --queue "reports/github_models/queues/$DAY.json" --output "reports/github_models/predictions/$DAY.json" --as-of "$NOW"
      - name: Settle previously frozen forecasts against verified outcomes
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch research/github-models-frozen "https://github.com/${GITHUB_REPOSITORY}.git" research-frozen
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m github_models.daily_settlement --archive-dir research-frozen --history data/github_models/verified_results.json --as-of "$NOW" --output reports/github_models/settlements/latest.json
      - name: Record immutable run identity and SHA256 checksums
        if: always()
        shell: bash
        run: |
          mkdir -p reports/github_models
          printf 'run_id=%s\ncommit=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" > reports/github_models/run_identity.txt
          find reports/github_models/queues reports/github_models/coverage reports/github_models/predictions -name '*.json' -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > reports/github_models/sha256sums.txt
      - name: Archive frozen predictions on dedicated research branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Warsaw date +%F)"
          FILE="reports/github_models/predictions/$DAY.json"
          if [ ! -f "$FILE" ]; then
            echo "No frozen prediction file to archive"
            exit 0
          fi
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          run_id = os.environ["GITHUB_RUN_ID"]
          day = __import__("datetime").datetime.now(__import__("zoneinfo").ZoneInfo("Europe/Warsaw")).date().isoformat()
          payload = pathlib.Path("reports/github_models/predictions", day + ".json").read_bytes()
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = "research/github-models-frozen"
          dest = f"frozen/{day}/{run_id}.json"
          api = "https://api.github.com/repos/" + repo
          def request(path, method="GET", data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(api + path, data=body, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)
          try:
              request("/git/ref/heads/" + branch)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              main = request("/git/ref/heads/main")
              request("/git/refs", "POST", {"ref": "refs/heads/" + branch,
                  "sha": main["object"]["sha"]})
          request("/contents/" + dest, "PUT", {"message": "archive: frozen independent predictions " + day + " run " + run_id,
              "content": base64.b64encode(payload).decode(), "branch": branch})
          print("Archived", dest, "on", branch)
          queue = pathlib.Path("reports/github_models/queues", day + ".json").read_bytes()
          request("/contents/" + f"queues/{day}/{run_id}.json", "PUT", {"message": "archive: paired queue " + run_id,
              "content": base64.b64encode(queue).decode(), "branch": branch})
          PY
      - name: Upload diagnostic artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-models-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/github_models/source_manifest.json
            reports/github_models/run_identity.txt
            reports/github_models/sha256sums.txt
            reports/github_models/queues/*.json
            reports/github_models/coverage/*.json
            reports/github_models/predictions/*.json
            reports/github_models/settlements/*.json
          if-no-files-found: warn
          retention-days: 90

