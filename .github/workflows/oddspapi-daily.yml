name: MULTIMODEL V2 - Superbet OddsPapi market layer (daily)
on:
  workflow_run:
    workflows:
      - 'GitHub Models V2 — A/B/C | daily forecast and audit'
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oddspapi-daily.yml'

permissions:
  contents: read

concurrency:
  group: oddspapi-poland-account-collector
  cancel-in-progress: false

jobs:
  odds-and-research-report:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout pinned, independently tested OddsPapi research implementation
        uses: actions/checkout@v4
        with:
          ref: 0e9af0ec27889bf84ea4fa6daeeb4fcb0d0e9394
          persist-credentials: false
      - name: Read immutable GitHub Models V2 inputs
        uses: actions/checkout@v4
        with:
          ref: research/github-models-frozen
          path: frozen_source
          persist-credentials: false
      - name: Checkout isolated SHADOW research code (no forecasts modified)
        uses: actions/checkout@v4
        with:
          ref: codex/multimodel-v2
          path: shadow_impl
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report generator
        run: |
          python -m pip install reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core poppler-utils
      - id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Reuse static market catalog for calendar month
        uses: actions/cache@v4
        with:
          path: research_cache
          key: oddspapi-v4-soccer-catalog-${{ steps.month.outputs.value }}
      - name: Select complete recent forecast queue (never a smaller smoke-test queue)
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          QUEUE="$(python - <<'PY'
          import json
          import os
          from datetime import datetime,timezone
          from pathlib import Path

          now=datetime.now(timezone.utc)
          root=Path("frozen_source/queues")
          candidates=[]
          for path in root.glob("*/*.json"):
              try:
                  p=json.loads(path.read_text(encoding="utf-8"))
                  if p.get("schema") != "github-models-fixture-queue-v1":
                      continue
                  stamp=datetime.fromisoformat(p["generated_at_utc"].replace("Z","+00:00"))
                  if stamp.tzinfo is None or not 0 <= (now-stamp).total_seconds() <= 48*3600:
                      continue
                  rel=path.relative_to(root)
                  if not (Path("frozen_source/frozen")/rel).is_file():
                      continue
                  if not (Path("frozen_source/markets")/rel).is_file():
                      continue
                  rows=p["fixtures"]
                  if not isinstance(rows,list):
                      continue
                  future=0
                  for row in rows:
                      dt=datetime.fromisoformat(row["kickoff_utc"].replace("Z","+00:00"))
                      if dt.tzinfo is not None and dt>now:
                          future+=1
                  if future:
                      candidates.append((path.parent.name,future,stamp,path))
              except (ValueError,KeyError,TypeError,OSError,AttributeError):
                  continue
          if not candidates:
              raise SystemExit("no_current_complete_frozen_forecast_queue")
          trigger=os.environ.get("TRIGGER_RUN_ID","").strip()
          if trigger:
              # Never join full A/B/C odds with a different (e.g. smoke) run.
              matched=[r for r in candidates if r[3].stem==trigger]
              if len(matched)!=1:
                  raise SystemExit("triggered_abc_forecast_archive_missing_or_stale")
              best=matched[0]
          else:
              latest_day=max(row[0] for row in candidates)
              eligible=(r for r in candidates if r[0]==latest_day)
              best=max(eligible,key=lambda r:(r[1],r[2]))
          print(best[3])
          PY
          )"
          test -n "$QUEUE"
          printf 'ODDSPAPI_INPUT_QUEUE=%s\n' "$QUEUE" >> "$GITHUB_ENV"
          printf 'ODDSPAPI_INPUT_REL=%s\n' "${QUEUE#frozen_source/queues/}" >> "$GITHUB_ENV"
          echo "SELECTED_FROZEN_QUEUE=$QUEUE"
      - name: Collect only Superbet.pl; up to nine league groups; quota hard stop 200/250
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          QUEUE="$ODDSPAPI_INPUT_QUEUE"
          test -n "$QUEUE"
          mkdir -p reports/oddspapi_daily
          cp "$QUEUE" reports/oddspapi_daily/pitch_queue.json
          python -B -m github_models.oddspapi_collect \
            --queue "$QUEUE" \
            --catalog-cache "research_cache/${{ steps.month.outputs.value }}/markets.json" \
            --batches 3 \
            --output-dir reports/oddspapi_daily
      - name: Compare exact markets against original frozen forecasts
        shell: bash
        run: |
          set -euo pipefail
          QUEUE="$ODDSPAPI_INPUT_QUEUE"
          REL="$ODDSPAPI_INPUT_REL"
          test -f "frozen_source/frozen/$REL"
          test -f "frozen_source/markets/$REL"
          python -B -m github_models.oddspapi_produce \
            --collection reports/oddspapi_daily/collection.json \
            --queue "$QUEUE" \
            --frozen "frozen_source/frozen/$REL" \
            --markets "frozen_source/markets/$REL" \
            --outdir reports/oddspapi_daily
          test -s reports/oddspapi_daily/MULTIMODEL_V2_SUPERBET_MARKET.pdf
          pdfinfo reports/oddspapi_daily/MULTIMODEL_V2_SUPERBET_MARKET.pdf | grep 'Pages:'
          pdftotext reports/oddspapi_daily/MULTIMODEL_V2_SUPERBET_MARKET.pdf - | grep -q 'SUPERBET.PL'
      - name: Read-only Superbet BTTS SHADOW overlay and missing-market report
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          REL="$ODDSPAPI_INPUT_REL"
          if test -s "frozen_source/shadow/$REL"; then
            # No OddsPapi endpoint is called here: use saved collection.json only.
            PYTHONPATH="$PWD/shadow_impl:$PWD" python -B -m github_models.shadow_superbet \
              --collection reports/oddspapi_daily/collection.json \
              --queue reports/oddspapi_daily/pitch_queue.json \
              --shadow "frozen_source/shadow/$REL" \
              --output-dir reports/oddspapi_daily
          else
            echo "::warning::Matching SHADOW archive not present; A/B/C odds remain intact"
            echo '{"status":"shadow_archive_not_available","production_unchanged":true}' > reports/oddspapi_daily/shadow_health.json
          fi
      - name: Publish health and missing-market warnings
        shell: bash
        run: |
          set -euo pipefail
          python -B -m github_models.oddspapi_health \
            --collection reports/oddspapi_daily/collection.json \
            --overlay reports/oddspapi_daily/market_overlay.json \
            --gaps reports/oddspapi_daily/market_gaps.json \
            --queue reports/oddspapi_daily/pitch_queue.json \
            --out reports/oddspapi_daily/market_health.json
      - name: Save time-stamped source evidence, comparisons and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-daily
          path: reports/oddspapi_daily/
          if-no-files-found: ignore
          retention-days: 90
