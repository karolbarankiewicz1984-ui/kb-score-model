name: KB21 recovery (official fixture diagnostics)
on:
  # Diagnostic only, before the original 11:30 Warsaw KB Score reporting target.
  # After the 08:45 UTC KB21 input collector: 11:00 Warsaw summer,
  # 10:00 Warsaw winter. This is ONLY a diagnostic, not the 11:30 LIVE PDF.
  # GitHub scheduled workflows may start late; no guarantee of exact runtime.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/kb21_legacy_report.py'
      - 'tests/test_kb21_legacy_report.py'
      - 'tools/kb21_legacy_calendar.py'
      - 'tools/kb21_public_fixtures.py'
      - 'tools/kb21_official_fpl.py'
      - 'tools/kb21_official_dfl.py'
      - 'tools/kb21_official_knvb.py'
      - 'tools/kb21_knvb_compare.py'
      - 'tools/kb21_official_laliga.py'
      - 'tools/kb21_laliga_compare.py'
      - 'tools/kb21_official_press_fixtures.py'
      - 'tools/kb21_official_press_compare.py'
      - 'tools/kb21_dfl_compare.py'
      - 'tools/kb21_official_source_seed.py'
      - 'tools/kb21_fpl_compare.py'
      - 'tools/kb21_fixture_digest.py'
      - 'tools/kb21_analyst_assessment.py'
      - 'tools/kb21_assessment_queue.py'
      - 'tools/kb21_queue_report.py'
      - 'tools/kb21_context_enrich.py'
      - 'tools/kb21_calendar_coverage.py'
      - 'tools/kb21_official_review.py'
      - 'tools/kb21_official_source_probe.py'
      - 'tools/kb21_official_research_compare.py'
      - 'tools/kb21_calendar_conflict_evidence.py'
      - 'tools/kb21_official_inventory_prefill.py'
      - 'data/kb21_official_research/**'
      - 'data/kb21_calendar_reviews/**'
      - 'tools/kb21_calendar_signoff.py'
      - 'tools/kb21_review_shortlist.py'
      - 'tools/kb21_fixture_crosscheck.py'
      - 'tools/kb21_market_review.py'
      - 'tests/test_kb21_analyst_assessment.py'
      - 'tests/test_kb21_assessment_queue.py'
      - 'tests/test_kb21_queue_report.py'
      - 'tests/test_kb21_context_enrich.py'
      - 'tests/test_kb21_calendar_coverage.py'
      - 'tests/test_kb21_official_review.py'
      - 'tests/test_kb21_official_source_probe.py'
      - 'tests/test_kb21_official_research_compare.py'
      - 'tests/test_kb21_calendar_conflict_evidence.py'
      - 'tests/test_kb21_official_inventory_prefill.py'
      - 'tests/test_kb21_calendar_signoff.py'
      - 'tests/test_kb21_review_shortlist.py'
      - 'tests/test_kb21_fixture_crosscheck.py'
      - 'tests/test_kb21_market_review.py'
      - 'tests/test_kb21_pipeline_integration.py'
      - 'tests/test_kb21_public_fixtures.py'
      - 'tests/test_kb21_official_fpl.py'
      - 'tests/test_kb21_official_dfl.py'
      - 'tests/test_kb21_official_knvb.py'
      - 'tests/test_kb21_knvb_compare.py'
      - 'tests/test_kb21_knvb_source_seed.py'
      - 'tests/test_kb21_official_laliga.py'
      - 'tests/test_kb21_laliga_compare.py'
      - 'tests/test_kb21_laliga_source_seed.py'
      - 'tests/test_kb21_official_press_fixtures.py'
      - 'tests/test_kb21_official_press_compare.py'
      - 'tests/test_kb21_official_press_seed.py'
      - 'tests/test_kb21_dfl_compare.py'
      - 'tests/test_kb21_official_source_seed.py'
      - 'tests/test_kb21_fpl_compare.py'
      - 'tests/test_kb21_legacy_calendar.py'
      - '.github/workflows/kb21-legacy-recovery.yml'
permissions:
  contents: read
concurrency:
  group: kb21-analyst-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run API-free recovery tests
        run: python -m unittest tests.test_kb21_legacy_report tests.test_kb21_legacy_calendar tests.test_kb21_public_fixtures tests.test_kb21_official_fpl tests.test_kb21_fpl_compare tests.test_kb21_official_dfl tests.test_kb21_dfl_compare tests.test_kb21_official_laliga tests.test_kb21_laliga_compare tests.test_kb21_laliga_source_seed tests.test_kb21_official_knvb tests.test_kb21_knvb_compare tests.test_kb21_knvb_source_seed tests.test_kb21_official_press_fixtures tests.test_kb21_official_press_compare tests.test_kb21_official_press_seed tests.test_kb21_official_source_seed tests.test_kb21_analyst_assessment tests.test_kb21_assessment_queue tests.test_kb21_queue_report tests.test_kb21_fixture_crosscheck tests.test_kb21_context_enrich tests.test_kb21_calendar_coverage tests.test_kb21_official_review tests.test_kb21_official_source_probe tests.test_kb21_calendar_signoff tests.test_kb21_official_research_compare tests.test_kb21_calendar_conflict_evidence tests.test_kb21_official_inventory_prefill tests.test_kb21_review_shortlist tests.test_kb21_market_review tests.test_kb21_pipeline_integration -v
      - name: Verify calendar gate on missing inputs
        run: |
          mkdir -p reports/kb21_legacy
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          d = datetime.now(ZoneInfo('Europe/Warsaw')).date().isoformat()
          Path('reports/kb21_legacy/calendar-input.json').write_text(json.dumps({'date': d, 'fixtures': []}), encoding='utf-8')
          PY
          python -m tools.kb21_legacy_calendar reports/kb21_legacy/calendar-input.json --output reports/kb21_legacy/calendar-gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reports/kb21_legacy/calendar-gate.json').read_text(encoding='utf-8'))
          assert result['status'] == 'BLOCKED', 'Calendar gate unexpectedly allowed missing fixtures'
          print('Safety check OK: missing calendar remains BLOCKED')
          PY
      - name: Refresh next three independent calendar snapshots when credential is available
        # On push, only test with already tracked snapshots to avoid API quota waste.
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          if not os.getenv("FOOTBALL_DATA_ORG_KEY"):
              print("::notice::FOOTBALL_DATA_ORG_KEY unavailable; independently verified calendar remains BLOCKED")
          else:
              today = datetime.now(ZoneInfo("Europe/Warsaw")).date()
              for offset in range(3):
                  day = (today + timedelta(days=offset)).isoformat()
                  proc = subprocess.run(
                      ["python", "-m", "tools.kb21_football_data_org",
                       "--date", day, "--target-competitions"],
                      check=False
                  )
                  if proc.returncode:
                      print(f"::warning::Independent calendar refresh failed for {day}; no calendar approval")
                  else:
                      target = Path("reports/kb21_legacy") / f"independent-source-{day}.json"
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes((Path("data/football_data_org") / f"{day}.json").read_bytes())
          PY
      - name: Collect three-day fixture candidates (diagnostic only)
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import subprocess
          from pathlib import Path
          today = datetime.now(ZoneInfo('Europe/Warsaw')).date()
          paths = []
          for offset in range(3):
              day = (today + timedelta(days=offset)).isoformat()
              output = f'reports/kb21_legacy/public-source-{day}.json'
              subprocess.run(['python', '-m', 'tools.kb21_public_fixtures', day, '--output', output], check=True)
              paths.append(output)
          subprocess.run(['python', '-m', 'tools.kb21_fixture_digest', *paths, '--output', 'reports/kb21_legacy/three-day-candidates.md'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_assessment_queue', *paths, '--output', 'reports/kb21_legacy/assessment-queue.json'], check=True)
          # Two public official Premier League JSON feeds; separate from KB Score
          # scoring and registered history. On an HTTP outage do not invent
          # fixture completeness; keep the usual diagnostic pipeline alive.
          import json
          scope = json.loads(Path('reports/kb21_legacy/assessment-queue.json').read_text(encoding='utf-8'))
          fpl_source = Path('reports/kb21_legacy/official-fpl-premier-league.json')
          fpl_command = [
              'python', '-m', 'tools.kb21_official_fpl',
              '--days', *scope['days'],
              '--output', str(fpl_source),
              '--output-md', 'reports/kb21_legacy/official-fpl-premier-league.md',
          ]
          fpl_run = subprocess.run(fpl_command, check=False)
          if fpl_run.returncode == 0:
              subprocess.run([
                  'python', '-m', 'tools.kb21_fpl_compare',
                  'reports/kb21_legacy/assessment-queue.json',
                  str(fpl_source),
                  '--output', 'reports/kb21_legacy/official-fpl-vs-espn.json',
                  '--output-md', 'reports/kb21_legacy/official-fpl-vs-espn.md',
              ], check=True)
          else:
              print('::warning::Official Premier League FPL JSON unavailable. '
                    'Full official fixture comparison is NOT completed; Calendar Gate stays BLOCKED')
          # LaLiga official organizer matchday pages: partial sampled rounds only.
          # NEVER infer signed calendar completeness from these checks.
          laliga_path = Path('reports/kb21_legacy/official-laliga.json')
          laliga_run = subprocess.run([
              'python', '-m', 'tools.kb21_official_laliga',
              '--days', *scope['days'], '--output', str(laliga_path)
          ], check=False)
          if laliga_run.returncode == 0 and laliga_path.is_file():
              subprocess.run([
                  'python', '-m', 'tools.kb21_laliga_compare',
                  'reports/kb21_legacy/assessment-queue.json',
                  str(laliga_path),
                  '--output', 'reports/kb21_legacy/official-laliga-vs-espn.json',
                  '--output-md', 'reports/kb21_legacy/official-laliga-vs-espn.md',
              ], check=True)
          else:
              print('::warning::LaLiga official fixture table unavailable; no calendar approval')
          # Two dated official organizer announcements for Serie A and Ligue 1.
          # Their 2026-10 matchdays are NOT complete league calendars; report
          # stale/out-of-article dates as gaps, never zero-match confirmations.
          press_files = {}
          for league, slug in (('ita.1', 'serie-a'), ('fra.1', 'ligue1')):
              output = Path('reports/kb21_legacy') / f'official-press-{slug}.json'
              run = subprocess.run([
                  'python', '-m', 'tools.kb21_official_press_fixtures',
                  '--league', league, '--days', *scope['days'],
                  '--output', str(output)
              ], check=False)
              if run.returncode == 0 and output.is_file():
                  subprocess.run([
                      'python', '-m', 'tools.kb21_official_press_compare',
                      'reports/kb21_legacy/assessment-queue.json',
                      str(output),
                      '--output', f'reports/kb21_legacy/official-press-{slug}-vs-espn.json',
                      '--output-md', f'reports/kb21_legacy/official-press-{slug}-vs-espn.md'
                  ], check=True)
                  press_data = json.loads(output.read_text(encoding='utf-8'))
                  if press_data.get('status') == 'OFFICIAL_DATED_ARTICLE_PARTIAL_FOR_REVIEW':
                      press_files[league] = str(output)
                  else:
                      print(f'::warning::{league} organizer article stale or unreadable: no calendar approval')
              else:
                  print(f'::warning::{league} organizer announcement fetch failed; no calendar approval')
          # Direct KNVB Eredivisie public schedule. A missing date is not
          # evidence of zero games, and organizer signatures remain manual.
          knvb_path = Path('reports/kb21_legacy/official-knvb-eredivisie.json')
          knvb_run = subprocess.run([
              'python', '-m', 'tools.kb21_official_knvb',
              '--days', *scope['days'], '--output', str(knvb_path)
          ], check=False)
          knvb_ready = False
          if knvb_run.returncode == 0 and knvb_path.is_file():
              subprocess.run([
                  'python', '-m', 'tools.kb21_knvb_compare',
                  'reports/kb21_legacy/assessment-queue.json',
                  str(knvb_path),
                  '--output', 'reports/kb21_legacy/official-knvb-vs-espn.json',
                  '--output-md', 'reports/kb21_legacy/official-knvb-vs-espn.md',
              ], check=True)
              knvb_data = json.loads(knvb_path.read_text(encoding='utf-8'))
              knvb_ready = (knvb_data.get('status') ==
                            'OFFICIAL_KNVB_PAGE_PARTIAL_FOR_REVIEW')
              if not knvb_ready:
                  print('::warning::KNVB fixture page unreadable; no calendar confirmation')
          else:
              print('::warning::KNVB official fixture fetch failed; no calendar confirmation')
          # Official DFL/Bundesliga Media page exposes a current matchday
          # HTML table with unambiguous UTC fixture kickoffs. It may NOT
          # cover all future dates or postponed fixtures. Fail closed.
          dfl_file = Path('reports/kb21_legacy/official-dfl-bundesliga.json')
          dfl_run = subprocess.run([
              'python', '-m', 'tools.kb21_official_dfl',
              '--days', *scope['days'],
              '--output', str(dfl_file),
              '--output-md', 'reports/kb21_legacy/official-dfl-bundesliga.md'
          ], check=False)
          dfl_status = 'FETCH_FAILED'
          if dfl_run.returncode == 0:
              dfl = json.loads(dfl_file.read_text(encoding='utf-8'))
              dfl_status = dfl['status']
              if dfl_status == 'OFFICIAL_PAGE_PARTIAL_MATCHDAY_FOR_REVIEW':
                  subprocess.run([
                      'python', '-m', 'tools.kb21_dfl_compare',
                      'reports/kb21_legacy/assessment-queue.json', str(dfl_file),
                      '--output', 'reports/kb21_legacy/official-dfl-vs-espn.json',
                      '--output-md', 'reports/kb21_legacy/official-dfl-vs-espn.md',
                  ], check=True)
              else:
                  print('::warning::Official Bundesliga HTML did not expose a usable matchday table')
          else:
              print('::warning::Official Bundesliga Media page unavailable; no DFL comparison')
          Path('reports/kb21_legacy/official-dfl-download-status.json').write_text(
              json.dumps({
                  'source': 'https://products.bundesliga.com/fixtures',
                  'status': dfl_status, 'calendar_gate': 'BLOCKED',
                  'live_betting_approved': False, 'report_days': scope['days']
              }, ensure_ascii=False, indent=2) + '\\n',
              encoding='utf-8')
          Path('reports/kb21_legacy/official-fpl-download-status.json').write_text(
              json.dumps({
                  'source': 'https://fantasy.premierleague.com/api/fixtures/',
                  'status': 'FETCHED_FOR_UNVERIFIED_COMPARISON'
                            if fpl_run.returncode == 0 else 'FETCH_FAILED',
                  'calendar_gate': 'BLOCKED',
                  'live_betting_approved': False,
                  'report_days': scope['days'],
              }, ensure_ascii=False, indent=2) + '\\n',
              encoding='utf-8')
          subprocess.run(['python', '-m', 'tools.kb21_official_source_probe',
                          'reports/kb21_legacy/assessment-queue.json',
                          '--output', 'reports/kb21_legacy/official-source-http-probes.json',
                          '--output-md', 'reports/kb21_legacy/official-source-http-probes.md'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_fixture_crosscheck',
                          'reports/kb21_legacy/assessment-queue.json',
                          '--snapshots-dir', 'data/football_data_org',
                          '--output', 'reports/kb21_legacy/crosschecked-queue.json'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_calendar_coverage',
                          'reports/kb21_legacy/crosschecked-queue.json',
                          '--snapshots-dir', 'data/football_data_org',
                          '--output-json', 'reports/kb21_legacy/calendar-coverage.json',
                          '--output-md', 'reports/kb21_legacy/calendar-coverage.md'], check=True)
          import json
          report = json.loads(Path('reports/kb21_legacy/crosschecked-queue.json').read_text(encoding='utf-8'))
          report_dates = sorted(report['days'])
          research = (Path('data/kb21_official_research') /
                      (report_dates[0] + '_to_' + report_dates[-1] + '.json'))
          if research.exists():
              official = json.loads(research.read_text(encoding='utf-8'))
              if set(official.get('date_scope', [])) == set(report.get('days', [])):
                  subprocess.run([
                      'python', '-m', 'tools.kb21_official_research_compare',
                      'reports/kb21_legacy/crosschecked-queue.json', str(research),
                      '--output-json', 'reports/kb21_legacy/official-source-compare.json',
                      '--output-md', 'reports/kb21_legacy/official-source-compare.md'
                  ], check=True)
                  subprocess.run([
                      'python', '-m', 'tools.kb21_calendar_conflict_evidence',
                      'reports/kb21_legacy/official-source-compare.json',
                      '--snapshots-dir', 'data/api_football/kb21_inputs',
                      '--output-json', 'reports/kb21_legacy/third-source-conflicts.json',
                      '--output-md', 'reports/kb21_legacy/third-source-conflicts.md'
                  ], check=True)
              else:
                  print('::notice::Official organizer facts cover historical dates only; no stale research applied to rolling future calendar')
          subprocess.run(['python', '-m', 'tools.kb21_official_review',
                          'reports/kb21_legacy/calendar-coverage.json',
                          '--output-json', 'reports/kb21_legacy/official-review.json',
                          '--output-md', 'reports/kb21_legacy/official-review.md'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_calendar_signoff',
                          'reports/kb21_legacy/official-review.json',
                          '--prepare-template',
                          '--output', 'reports/kb21_legacy/official-inventory-template.json'], check=True)
          if research.exists() and set(official.get('date_scope', [])) == set(report.get('days', [])):
              subprocess.run([
                  'python', '-m', 'tools.kb21_official_inventory_prefill',
                  'reports/kb21_legacy/official-inventory-template.json', str(research),
                  '--third-source-evidence', 'reports/kb21_legacy/third-source-conflicts.json',
                  '--output', 'reports/kb21_legacy/official-inventory-research-draft.json'
              ], check=True)
          # Prepare the latest unsigned official research draft from direct
          # organizer feeds for the current three dates. Manual research is
          # kept unchanged and all contradictions are shown, never silently
          # overwritten. It is NOT a signed Calendar Gate inventory.
          original_draft = Path('reports/kb21_legacy/official-inventory-template.json')
          researched_draft = Path('reports/kb21_legacy/official-inventory-research-draft.json')
          if researched_draft.is_file():
              original_draft = researched_draft
          seed_cmd = [
              'python', '-m', 'tools.kb21_official_source_seed',
              str(original_draft),
              '--output', 'reports/kb21_legacy/official-inventory-direct-sources-draft.json',
          ]
          if fpl_run.returncode == 0 and fpl_source.is_file():
              seed_cmd += ['--fpl', str(fpl_source)]
          if dfl_status == 'OFFICIAL_PAGE_PARTIAL_MATCHDAY_FOR_REVIEW' and dfl_file.is_file():
              seed_cmd += ['--dfl', str(dfl_file)]
          if laliga_run.returncode == 0 and laliga_path.is_file():
              laliga_data = json.loads(laliga_path.read_text(encoding='utf-8'))
              if laliga_data.get('status') == 'OFFICIAL_PARTIAL_MATCHDAY_WINDOW_FOR_REVIEW':
                  seed_cmd += ['--laliga', str(laliga_path)]
          if knvb_ready:
              seed_cmd += ['--knvb', str(knvb_path)]
          for league, flag in (('ita.1', '--serie-a'), ('fra.1', '--ligue1')):
              if league in press_files:
                  seed_cmd += [flag, press_files[league]]
          subprocess.run(seed_cmd, check=True)
          # A reviewed inventory may be supplied for the exact three Warsaw dates.
          # Never substitute unsigned or stale research for an approved inventory.
          from datetime import date
          review_dates = sorted(report['days'])
          reviewed_path = (Path('data/kb21_calendar_reviews') /
                           (review_dates[0] + '_to_' + review_dates[-1] + '.json'))
          review_input = Path('reports/kb21_legacy/official-inventory-template.json')
          if reviewed_path.is_file():
              supplied = json.loads(reviewed_path.read_text(encoding='utf-8'))
              if set(supplied.get('days', {})) != set(review_dates):
                  raise RuntimeError('Reviewed calendar dates do not match requested dates; refusing stale signoff')
              review_input = reviewed_path
              print(f'::notice::Loaded human-reviewed calendar inventory {reviewed_path}; validating independently')
          else:
              print('::notice::No signed official calendar inventory for current three dates; gate remains BLOCKED')
          subprocess.run(['python', '-m', 'tools.kb21_calendar_signoff',
                          'reports/kb21_legacy/crosschecked-queue.json',
                          str(review_input),
                          '--api-snapshots-dir', 'data/api_football/kb21_inputs',
                          '--output', 'reports/kb21_legacy/official-calendar-gate-audit.json'], check=True)
          gate = json.loads(Path('reports/kb21_legacy/official-calendar-gate-audit.json').read_text(encoding='utf-8'))
          for day, row in sorted(gate['days'].items()):
              print(f"KB21 calendar {day}: {row['calendar_gate']} ({row['status']}); "
                    f"unresolved checks {len(row['errors'])}")
          if gate['calendar_gate'] == 'PASS_MANUAL':
              print('::notice::Official calendar manually reviewed for all dates; LIVE scoring still requires separate gates')
          subprocess.run(['python', '-m', 'tools.kb21_context_enrich',
                          'reports/kb21_legacy/crosschecked-queue.json',
                          '--snapshots-dir', 'data/api_football/kb21_inputs',
                          '--output', 'reports/kb21_legacy/research-queue.json'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_queue_report',
                          'reports/kb21_legacy/research-queue.json',
                          '--outdir', 'reports/kb21_legacy/worksheets'], check=True)
          subprocess.run(['python', '-m', 'tools.kb21_review_shortlist',
                          'reports/kb21_legacy/research-queue.json',
                          '--output-json', 'reports/kb21_legacy/review-shortlist.json',
                          '--output-md', 'reports/kb21_legacy/review-shortlist.md',
                          '--limit', '10'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kb21-legacy-api-free-diagnostic
          path: |
            reports/kb21_legacy/calendar-gate.json
            reports/kb21_legacy/public-source-*.json
            reports/kb21_legacy/three-day-candidates.md
            reports/kb21_legacy/assessment-queue.json
            reports/kb21_legacy/official-fpl-download-status.json
            reports/kb21_legacy/official-dfl-download-status.json
            reports/kb21_legacy/official-dfl-bundesliga.json
            reports/kb21_legacy/official-dfl-bundesliga.md
            reports/kb21_legacy/official-press-serie-a.json
            reports/kb21_legacy/official-press-serie-a-vs-espn.json
            reports/kb21_legacy/official-press-serie-a-vs-espn.md
            reports/kb21_legacy/official-press-ligue1.json
            reports/kb21_legacy/official-press-ligue1-vs-espn.json
            reports/kb21_legacy/official-press-ligue1-vs-espn.md
            reports/kb21_legacy/official-knvb-eredivisie.json
            reports/kb21_legacy/official-knvb-vs-espn.json
            reports/kb21_legacy/official-knvb-vs-espn.md
            reports/kb21_legacy/official-laliga.json
            reports/kb21_legacy/official-laliga-vs-espn.json
            reports/kb21_legacy/official-laliga-vs-espn.md
            reports/kb21_legacy/official-dfl-vs-espn.json
            reports/kb21_legacy/official-dfl-vs-espn.md
            reports/kb21_legacy/official-fpl-premier-league.json
            reports/kb21_legacy/official-fpl-premier-league.md
            reports/kb21_legacy/official-fpl-vs-espn.json
            reports/kb21_legacy/official-fpl-vs-espn.md
