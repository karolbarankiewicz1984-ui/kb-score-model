name: PitchAPI prematch xG context - API and KB21 companion
# Operational refresh: 2026-10-16, generate next-day 2026-10-17 read-only context
# through the pre-existing push trigger, without changing calculations or parameters.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Future target date YYYY-MM-DD, blank = next 3 days in Warsaw'
        required: false
        type: string
  schedule:
    # 17:15 UTC: tomorrow's context ready before early-morning API and KB reports.
    - cron: '15 17 * * *'
  push:
    paths:
      - '.github/workflows/pitchapi-prematch-context.yml'

permissions:
  contents: write

concurrency:
  group: pitchapi-prematch
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cutoff, source pairing, missing data
        run: python -m unittest tests.test_pitchapi_prematch_context -v
      - name: Install PitchAPI client
        run: python -m pip install --disable-pip-version-check pitchapi==0.1.6
      - name: Fetch prior games only - not tomorrow results
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          test -n "$PITCHAPI_API_KEY" || { echo "Missing PITCHAPI_API_KEY"; exit 1; }
          if [ -n "$TARGET_DATE" ]; then
            python -m tools.pitchapi_prematch_context --date "$TARGET_DATE" --max-fixtures 80
          else
            TODAY="$(TZ=Europe/Warsaw date +%F)"
            for OFFSET in 1 2 3; do
              DAY="$(TZ=Europe/Warsaw date -d "$TODAY + $OFFSET day" +%F)"
              python -m tools.pitchapi_prematch_context --date "$DAY" --max-fixtures 80
            done
          fi
      - name: Safe summary
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          paths=sorted(glob.glob('data/pitchapi/prematch/*.json'))
          if not paths:
              raise SystemExit('No prematch data produced')
          p=json.load(open(paths[-1],encoding='utf-8'))
          msg=(f"# PitchAPI prematch context {p['target_date']}\n\n"
               f"- Upcoming fixtures: {p['available_upcoming']}\n"
               f"- Collected: {p['fixtures_collected']}\n"
               f"- Both teams with at least 3 complete earlier matches: "
               f"{p['fixtures_with_both_sides_sufficient']}\n"
               f"- Model scores and N counters: UNCHANGED\n"
               f"- Companion for API Market / KB Score, not prediction or calibrated probability.\n")
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(msg)
          PY
      - name: Upload companion report
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-prematch-context
          path: |
            data/pitchapi/prematch/*.json
            reports/pitchapi/prematch/*.md
          if-no-files-found: error
          retention-days: 30
      - name: Save independent pre-match context only
        env:
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DAY="${TARGET_DATE:-$(TZ=Europe/Warsaw date -d tomorrow +%F)}"
          SNAPSHOT="data/pitchapi/prematch/$DAY.json"
          REPORT="reports/pitchapi/prematch/$DAY.md"
          test -s "$SNAPSHOT"
          test -s "$REPORT"

          # A previous run may have pushed the same date while this run worked.
          # Upload-artifact already succeeded; an equal/newer pre-match snapshot
          # on main is NOT a failed data collection.
          for attempt in 1 2 3; do
            git fetch origin main
            if python - "$SNAPSHOT" "$DAY" <<'PY'
          import json, pathlib, subprocess, sys
          path, day = sys.argv[1:]
          local = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          result = subprocess.run(["git", "show", "origin/main:" + path],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              sys.exit(1)
          try:
              remote = json.loads(result.stdout)
          except (ValueError, TypeError):
              sys.exit(1)
          same = (remote.get("schema") == "pitchapi-prematch-context-v1"
                  and remote.get("target_date") == day)
          valid = (isinstance(remote.get("fixtures"), list)
                   and remote.get("fixtures_collected") == len(remote["fixtures"]))
          if same and valid and remote.get("snapshot_utc", "") >= local.get("snapshot_utc", ""):
              sys.exit(0)
          sys.exit(1)
          PY
            then
              echo "::notice::PitchAPI snapshot for $DAY already published with equal or newer timestamp."
              exit 0
            fi

            # Re-base the *index* on the latest main, retaining our generated
            # worktree files. This handles add/add without an interactive rebase.
            git reset --mixed origin/main
            git add -- "$SNAPSHOT" "$REPORT"
            if git diff --cached --quiet; then
              echo "::notice::PitchAPI output already matches main."
              exit 0
            fi
            git commit -m "data: read-only PitchAPI prematch xG context"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent main update, rechecking (attempt $attempt/3)"
          done
          echo "::error::Could not publish PitchAPI data after three safe attempts."
          exit 1
