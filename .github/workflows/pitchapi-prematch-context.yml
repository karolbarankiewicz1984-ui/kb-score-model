name: PitchAPI prematch xG context - API and KB21 companion
# Operational refresh: 2026-10-16, generate next-day 2026-10-17 read-only context
# through the pre-existing push trigger, without changing calculations or parameters.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional single target date YYYY-MM-DD; blank = Warsaw today, tomorrow and day after'
        required: false
        type: string
  schedule:
    # 04:15 UTC: refresh all three dates ahead of the 11:30 Europe/Warsaw MULTIMODEL report.
    - cron: '15 4 * * *'
    # 17:15 UTC: refresh the same horizon for late fixture updates.
    - cron: '15 17 * * *'
  push:
    paths:
      - '.github/workflows/pitchapi-prematch-context.yml'

permissions:
  contents: write

concurrency:
  group: pitchapi-prematch
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cutoff, source pairing, missing data
        run: python -m unittest tests.test_pitchapi_prematch_context -v
      - name: Install PitchAPI client
        run: python -m pip install --disable-pip-version-check pitchapi==0.1.6
      - name: Fetch prior games only - not tomorrow results
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          test -n "$PITCHAPI_API_KEY" || { echo "Missing PITCHAPI_API_KEY"; exit 1; }
          if [ -n "$TARGET_DATE" ]; then
            DAYS=("$TARGET_DATE")
          else
            TODAY="$(TZ=Europe/Warsaw date +%F)"
            DAYS=("$TODAY" "$(TZ=Europe/Warsaw date -d "$TODAY + 1 day" +%F)" "$(TZ=Europe/Warsaw date -d "$TODAY + 2 days" +%F)")
          fi
          for DAY in "${DAYS[@]}"; do
            echo "::group::PitchAPI $DAY"
            python -m tools.pitchapi_prematch_context --date "$DAY" --max-fixtures 80
            echo "::endgroup::"
          done
      - name: Safe summary
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          paths=sorted(glob.glob('data/pitchapi/prematch/*.json'))
          if not paths:
              raise SystemExit('No prematch data produced')
          p=json.load(open(paths[-1],encoding='utf-8'))
          msg=(f"# PitchAPI prematch context {p['target_date']}\n\n"
               f"- Upcoming fixtures: {p['available_upcoming']}\n"
               f"- Collected: {p['fixtures_collected']}\n"
               f"- Both teams with at least 3 complete earlier matches: "
               f"{p['fixtures_with_both_sides_sufficient']}\n"
               f"- Model scores and N counters: UNCHANGED\n"
               f"- Companion for API Market / KB Score, not prediction or calibrated probability.\n")
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(msg)
          PY
      - name: Upload companion report
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-prematch-context
          path: |
            data/pitchapi/prematch/*.json
            reports/pitchapi/prematch/*.md
          if-no-files-found: error
          retention-days: 30
      - name: Save independent pre-match context only
        env:
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY="$(TZ=Europe/Warsaw date +%F)"
          if [ -n "$TARGET_DATE" ]; then
            DAYS=("$TARGET_DATE")
          else
            DAYS=("$TODAY" "$(TZ=Europe/Warsaw date -d "$TODAY + 1 day" +%F)" "$(TZ=Europe/Warsaw date -d "$TODAY + 2 days" +%F)")
          fi
          for DAY in "${DAYS[@]}"; do
            test -s "data/pitchapi/prematch/$DAY.json"
            test -s "reports/pitchapi/prematch/$DAY.md"
          done
          # Avoid publishing stale snapshots over newer independently committed data.
          for attempt in 1 2 3; do
            git fetch origin main
            for DAY in "${DAYS[@]}"; do
              SNAPSHOT="data/pitchapi/prematch/$DAY.json"
              if git cat-file -e "origin/main:$SNAPSHOT" 2>/dev/null; then
                REMOTE_STAMP="$(git show "origin/main:$SNAPSHOT" | python -c 'import json,sys; print(json.load(sys.stdin).get("snapshot_utc",""))')"
                LOCAL_STAMP="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("snapshot_utc",""))' "$SNAPSHOT")"
                if [[ "$REMOTE_STAMP" > "$LOCAL_STAMP" || "$REMOTE_STAMP" == "$LOCAL_STAMP" ]]; then
                  git show "origin/main:$SNAPSHOT" > "$SNAPSHOT"
                  git show "origin/main:reports/pitchapi/prematch/$DAY.md" > "reports/pitchapi/prematch/$DAY.md" || true
                fi
              fi
            done
            git reset --mixed origin/main
            for DAY in "${DAYS[@]}"; do
              git add -- "data/pitchapi/prematch/$DAY.json" "reports/pitchapi/prematch/$DAY.md"
            done
            if git diff --cached --quiet; then
              echo "::notice::All three PitchAPI snapshots already current."
              exit 0
            fi
            git commit -m "data: three-day PitchAPI prematch context"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent main update (attempt $attempt/3)"
          done
          echo "::error::Could not publish PitchAPI three-day context."
          exit 1
