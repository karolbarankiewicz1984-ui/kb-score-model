name: Expand STS candidate pool and rerun once
on:
  push:
    paths:
      - '.github/workflows/expand-sts-pool-and-rerun-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand background pool
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/api_market_scan.py')
          s = p.read_text(encoding='utf-8')
          if 'TOP_N = 30' in s:
              s = s.replace('TOP_N = 30', 'TOP_N = 150', 1)
          elif 'TOP_N = 150' not in s:
              raise SystemExit('TOP_N target not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build STS-oriented API report for today
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          test -n "$API_FOOTBALL_KEY"
          python tools/api_national_today_prefetch.py
          python tools/api_market_scan.py
          python tools/api_market_v3_enrich.py
          python tools/api_market_report_diversify.py
          python -m pip install --disable-pip-version-check 'reportlab>=4,<5'
          python tools/render_api_market_pdf.py
      - name: Commit outputs and self-remove
        shell: bash
        run: |
          rm .github/workflows/expand-sts-pool-and-rerun-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: widen STS background pool and regenerate report"
          git push origin main
