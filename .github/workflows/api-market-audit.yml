name: API Market Audit next-day
on:
  schedule:
    # Warsaw 12:00 local, DST aware: 10:00 UTC summer, 11:00 UTC winter.
    - cron: '0 10,11 * * *'
  workflow_dispatch:
    inputs:
      audit_date:
        description: 'Match date YYYY-MM-DD (blank = yesterday Europe/Warsaw)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Warsaw clock gate
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Europe/Warsaw date +%H)" != "12" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout independent experimental code
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: experiment/api-market-2-playable-odds
      - name: Install PDF dependency
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install 'reportlab>=4,<5'
      - name: Retrieve original pre-match frozen snapshot
        if: steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_DATE: ${{ inputs.audit_date }}
        shell: bash
        run: |
          set -euo pipefail
          target="$AUDIT_DATE"
          if [ -z "$target" ]; then target=$(TZ=Europe/Warsaw date -d 'yesterday' +%F); fi
          echo "$target" > /tmp/audit_date
          mkdir -p /tmp/audit_artifacts
          # Search recent runs, including those triggered on previous days for future match dates.
          found=0
          while IFS= read -r run; do
            mkdir -p "/tmp/audit_artifacts/$run"
            if gh run download "$run" -n api-market-multiday-experiment -D "/tmp/audit_artifacts/$run" 2>/dev/null; then
              file="/tmp/audit_artifacts/$run/reports/api_market_scan/audit_input/$target.json"
              if [ ! -f "$file" ]; then
                file="/tmp/audit_artifacts/$run/audit_input/$target.json"
              fi
              if [ ! -f "$file" ]; then
                file="/tmp/audit_artifacts/$run/$target.json"
              fi
              if [ -f "$file" ]; then
                cp "$file" /tmp/frozen_picks.json
                echo "Found frozen snapshot in run $run"
                found=1
                break
              fi
            fi
          done < <(gh run list --workflow api-market-multiday-experiment.yml --limit 60 --json databaseId --jq '.[].databaseId')
          if [ "$found" != 1 ]; then
            echo "::error::No frozen original picks for $target. Cannot audit without original snapshot."
            exit 1
          fi
      - name: Audit completed matches and create PDF
        if: steps.clock.outputs.run == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "$API_FOOTBALL_KEY"
          python tools/api_market_audit.py "$(cat /tmp/audit_date)" --input /tmp/frozen_picks.json
      - name: Upload audit PDF and detailed JSON
        if: always() && steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-market-audit
          path: reports/api_market_scan/audit/API_MARKET_AUDIT_*
          if-no-files-found: warn
