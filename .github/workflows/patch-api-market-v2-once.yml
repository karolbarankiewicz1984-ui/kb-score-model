name: Patch API Market Scan v2 once

on:
  push:
    paths:
      - ".github/workflows/patch-api-market-v2-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch market data field and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/api_market_scan.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"market": market,\n        "market_movement_pp"', '"market_data": market,\n        "market_movement_pp"')
          s = s.replace('item["market"].get("exact_line_available")', 'item["market_data"].get("exact_line_available")')
          s = s.replace('old["market"].get("exact_line_available")', 'old["market_data"].get("exact_line_available")')
          s = s.replace('c["market"].get("exact_line_available")', 'c["market_data"].get("exact_line_available")')
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/patch-api-market-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api_market_scan.py .github/workflows/patch-api-market-v2-once.yml
          git commit -m "fix: keep PURE market key separate from market data"
          git pull --rebase origin main
          git push origin main
