name: API Market Closing Snapshot

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD; blank = today"
        required: false
        type: string

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: write

concurrency:
  group: api-market-closing
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify API secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: test -n "$API_FOOTBALL_KEY"
      - name: Collect near-kickoff market
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/api_market_closing.py "${{ inputs.date }}"
          else
            python tools/api_market_closing.py
          fi
      - name: Commit closing snapshot with safe bounded Git retries
        shell: bash
        run: |
          python tools/api_market_integrity.py
          python -m tools.api_market_closing_publish
