name: MULTIMODEL V2 SHADOW regression
on:
  push:
    branches:
      - codex/multimodel-shadow-20261120
  pull_request:
    paths:
      - 'github_models/shadow*.py'
      - 'tests/test_github_models_shadow.py'
      - '.github/workflows/multimodel-shadow-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing report dependencies
        run: |
          python -m pip install 'reportlab>=4,<6' 'PyMuPDF>=1.24.4,<2'
      - name: Test independent SHADOW, legacy market invariants and seven-day PDF
        run: |
          python -B -m unittest -v \
            tests.test_github_models_shadow \
            tests.test_github_models_event_markets \
            tests.test_github_models_abc_filter \
            tests.test_github_models_abc_pdf \
            tests.test_github_models_weekly_reports
